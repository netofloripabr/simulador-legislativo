<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parlamentares · SimulaLEGIS</title>
<!-- Protótipo (10/10/2026): manual do parlamentar de primeiro mandato — seleção de perfil,
     parabéns e capítulos com rolagem em foco (figura presa enquanto o texto passa).
     A cor de destaque segue o partido do deputado escolhido (--a). -->
<style>
@font-face{ font-family:"Inter"; src:url(../fontes/InterVariable.woff2) format("woff2"); font-weight:100 900; font-display:swap; }
:root{ --fundo:#0B0F0D; --sup:#14191A; --sup2:#1B2022; --linha:rgba(242,244,245,.09); --texto:#F2F4F5; --sec:#A9AEB3; --ter:#6B7178; --a:#34E84A; --a-rgb:52,232,74; color-scheme:dark; }
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; } html,body{ margin:0; background:var(--fundo); color:var(--texto); font:15px/1.55 "Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
.topo{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; height:56px; padding:0 16px; background:rgba(11,15,13,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--linha); }
.wm{ font-weight:800; font-size:17px; letter-spacing:-.02em; } .wm b{ color:#34E84A; }
.topo .sep{ font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ter); padding-left:12px; border-left:1px solid var(--linha); }
.vistas{ margin-left:auto; display:flex; gap:4px; } .vistas a{ font:700 13px "Inter"; color:var(--sec); text-decoration:none; padding:7px 12px; border-radius:999px; } .vistas a.on{ color:var(--texto); background:rgba(242,244,245,.08); }
.olho{ font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--sec); }
h1,h2{ font-weight:900; letter-spacing:-.05em; margin:0; } h1 i, h2 i{ font-style:normal; color:var(--a); }
.wrap{ max-width:1180px; margin:0 auto; padding:0 20px; }

/* ---------- seleção: roda de nomes (rolagem vertical, o nome do centro é o escolhido) ---------- */
.roda{ position:relative; height:calc(100vh - 56px - 170px); overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none; -webkit-mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent); } .roda::-webkit-scrollbar{ display:none; }
.roda ol{ list-style:none; margin:0; padding:calc(50vh - 140px) 0; }
.roda li{ scroll-snap-align:center; text-align:center; font:900 clamp(30px,5.4vw,64px)/1.12 "Inter"; letter-spacing:-.045em; color:#F2F4F5; cursor:pointer; padding:2px 16px; white-space:nowrap; will-change:transform,filter,opacity; transform-origin:center; }
.roda li.on{ color:var(--a); }
.rodainfo{ text-align:center; padding:14px 16px 24px; } .rodainfo .pt{ color:var(--sec); font-size:14px; margin-bottom:10px; } .rodainfo .btn{ pointer-events:auto; }
.rodainfo .dica{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ter); margin-top:10px; }
.btn{ display:inline-flex; align-items:center; gap:8px; font:700 14px "Inter"; color:#0B0D0E; background:var(--a); border:0; border-radius:999px; padding:11px 20px; cursor:pointer; text-decoration:none; } .btn.sec{ background:none; color:var(--texto); border:1px solid rgba(242,244,245,.2); }

/* ---------- capa do perfil: mapa pipocando na cor do partido ---------- */
.hero{ position:relative; height:min(92vh,800px); min-height:600px; overflow:hidden; }
.hero canvas{ position:absolute; inset:0; width:100%; height:100%; }
.hero .luz{ position:absolute; inset:-20%; background:radial-gradient(circle at 70% 35%, rgba(var(--a-rgb),.18), transparent 45%); pointer-events:none; }
.hero .txt{ position:absolute; left:0; right:0; bottom:0; padding:0 20px 44px; max-width:1180px; margin:0 auto; }
.hero h1{ font-size:clamp(48px,9vw,112px); line-height:.88; margin:12px 0 18px; } .hero h1 i{ display:block; }
.hero .ftp{ width:64px; height:64px; border-radius:50%; object-fit:cover; object-position:50% 18%; box-shadow:0 0 0 2.5px var(--a), 0 10px 30px -8px rgba(var(--a-rgb),.8); }
.pops{ display:flex; gap:26px; flex-wrap:wrap; } .pops div{ display:flex; flex-direction:column; opacity:0; transform:translateY(14px) scale(.96); animation:pop .6s cubic-bezier(.2,.9,.3,1.3) forwards; }
.pops b{ font-size:34px; font-weight:800; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums; } .pops b.a{ color:var(--a); } .pops span{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ter); margin-top:6px; }
.etq{ position:absolute; z-index:2; transform:translate(-50%,-115%) scale(0); display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:74px; padding:10px 14px; border-radius:999px; background:radial-gradient(circle at 35% 30%, rgba(var(--a-rgb),.45), rgba(var(--a-rgb),.12) 70%); border:1px solid rgba(var(--a-rgb),.7); box-shadow:0 0 24px rgba(var(--a-rgb),.45), inset 0 0 12px rgba(var(--a-rgb),.25); color:var(--texto); white-space:nowrap; backdrop-filter:blur(4px); animation:bolha .7s cubic-bezier(.2,1.4,.4,1) forwards; pointer-events:none; } .etq span{ font:700 11px "Inter"; } .etq b{ font:900 17px/1.1 "Inter"; letter-spacing:-.02em; color:#fff; }
@keyframes bolha{ 0%{ transform:translate(-50%,-115%) scale(0); opacity:0; } 70%{ transform:translate(-50%,-115%) scale(1.12); opacity:1; } 100%{ transform:translate(-50%,-115%) scale(1); opacity:1; } }
.etq b{ color:var(--a); margin-left:4px; } .etq::after{ content:""; position:absolute; left:50%; bottom:-6px; width:1px; height:6px; background:rgba(var(--a-rgb),.6); }
@keyframes pop{ to{ opacity:1; transform:none; } } .etq{ --t:translate(-50%,-130%); } @keyframes popE{ to{ opacity:1; } }
@media (max-width:760px){ .hero{ height:auto; min-height:0; } .hero canvas{ position:relative; height:52vh; } .hero .txt{ position:relative; } }

/* ---------- perfil ---------- */
.cab{ display:flex; align-items:center; gap:16px; padding-block:28px 18px; } .cab img{ width:72px; height:72px; border-radius:50%; object-fit:cover; object-position:50% 18%; box-shadow:0 0 0 2.5px var(--a); }
.cab h1{ font-size:clamp(30px,4.5vw,48px); line-height:1; } .cab .pt{ color:var(--sec); font-size:14px; margin-top:4px; } .cab .btn{ margin-left:auto; }
.sanf{ width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto 24px; gap:14px; align-items:center; padding:18px 4px; background:none; border:0; border-top:1px solid var(--linha); color:var(--texto); font:800 22px "Inter"; letter-spacing:-.03em; text-align:left; cursor:pointer; }
.sanf i{ font:500 13px "Inter"; font-style:normal; color:var(--ter); letter-spacing:0; } .sanf em{ font-style:normal; color:var(--ter); font-size:22px; text-align:center; } .sanf.on em{ color:var(--a); }
.sanf.sub{ font-size:16px; padding:14px 4px; } .corpo{ padding:4px 0 26px; }
.ctx{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; } .ctx button{ font:600 13px "Inter"; padding:8px 14px; border-radius:999px; border:1px solid var(--linha); background:none; color:var(--sec); cursor:pointer; } .ctx button.on{ color:#0B0D0E; background:var(--a); border-color:var(--a); }
.quadro{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:24px; background:var(--sup); border:1px solid var(--linha); border-radius:20px; padding:20px; } .quadro h3{ margin:4px 0 6px; font-size:22px; letter-spacing:-.03em; } .quadro p{ color:var(--sec); margin:0 0 10px; font-size:14px; } .quadro svg{ width:100%; height:auto; max-height:420px; }
.rank{ list-style:none; margin:6px 0 0; padding:0; } .rank li{ display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--linha); font-size:13.5px; } .rank li i{ font-style:normal; color:var(--ter); font-size:12px; } .rank b{ font-variant-numeric:tabular-nums; } .rank li.eu{ color:var(--a); font-weight:700; } .rank small{ color:var(--ter); }
.emb{ width:100%; height:1200px; margin-top:24px; border:0; border-radius:18px; background:var(--sup); }
.breve{ color:var(--ter); font-size:14px; padding:6px 4px 20px; }
@media (max-width:860px){ .quadro{ grid-template-columns:1fr; } .cab .btn{ display:none; } }
/* seções do perfil: faixa de título, entrada suave e seta para a próxima */
.secao{ position:relative; padding:44px 0 70px; border-top:1px solid var(--linha); scroll-margin-top:100px; }
.secao .tag{ display:flex; align-items:center; gap:14px; } .tg{ flex:none; width:30px; height:30px; border-radius:50%; border:1px solid var(--linha); background:none; color:var(--ter); font:600 18px/1 "Inter"; cursor:pointer; } .tg:hover{ color:var(--a); border-color:rgba(var(--a-rgb),.5); } .secao .tag h2{ font-size:clamp(36px,5.5vw,64px); line-height:.95; }
.secao .lead{ color:var(--sec); font-size:17px; max-width:680px; margin:10px 0 26px; }
.rv{ opacity:0; transform:translateY(40px); transition:opacity .9s cubic-bezier(.2,.8,.3,1), transform .9s cubic-bezier(.2,.8,.3,1); } .rv.in{ opacity:1; transform:none; }
.seta{ position:absolute; left:50%; bottom:22px; transform:translateX(-50%); width:38px; height:38px; border-radius:50%; border:1px solid rgba(var(--a-rgb),.5); color:var(--a); display:flex; align-items:center; justify-content:center; text-decoration:none; font-size:18px; animation:quica 2.2s ease-in-out infinite; } .seta:hover{ background:rgba(var(--a-rgb),.12); }
@keyframes quica{ 50%{ transform:translate(-50%,6px); } }
.hero .seta{ z-index:3; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 14px; } .chips button{ font:600 13px "Inter"; padding:8px 14px; border-radius:999px; border:1px solid var(--linha); background:none; color:var(--sec); cursor:pointer; } .chips button.on{ color:#0B0D0E; background:var(--a); border-color:var(--a); } .chips .r{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ter); align-self:center; margin-right:4px; }
.bloco{ background:var(--sup); border:1px solid var(--linha); border-radius:20px; padding:22px; margin-bottom:16px; } .bloco h3{ margin:0 0 4px; font-size:22px; letter-spacing:-.03em; } .bloco > p{ color:var(--sec); margin:0 0 14px; font-size:14px; }
.tl4{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; } .tl4 > div{ border-top:3px solid rgba(var(--a-rgb),.6); padding-top:10px; } .tl4 b{ display:block; font-size:20px; } .tl4 span{ font-size:12.5px; color:var(--sec); display:block; margin-top:4px; line-height:1.45; }
.semana{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; } .semana > div{ background:var(--sup2); border-radius:14px; padding:12px; min-height:120px; } .semana > div.on{ box-shadow:inset 0 0 0 1.5px rgba(var(--a-rgb),.6); } .semana b{ display:block; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--ter); margin-bottom:6px; } .semana .it{ font-size:12.5px; color:var(--texto); margin-bottom:6px; line-height:1.35; } .semana .it i{ font-style:normal; color:var(--a); font-weight:700; margin-right:4px; }
.qtab{ width:100%; border-collapse:collapse; font-size:14px; } .qtab td{ padding:9px 6px; border-bottom:1px solid var(--linha); } .qtab td:last-child{ text-align:right; font-weight:800; color:var(--a); white-space:nowrap; } .qtab small{ display:block; color:var(--ter); font-size:12px; }
.trilha{ position:relative; display:flex; gap:0; overflow-x:auto; padding:24px 4px 8px; scrollbar-width:thin; } .trilha .e{ flex:none; width:170px; position:relative; padding-top:26px; opacity:0; transform:translateY(10px); animation:pop .5s cubic-bezier(.2,.9,.3,1.2) forwards; }
.trilha .e::before{ content:""; position:absolute; top:7px; left:0; right:0; height:2px; background:rgba(var(--a-rgb),.35); } .trilha .e::after{ content:""; position:absolute; top:0; left:0; width:16px; height:16px; border-radius:50%; background:var(--a); box-shadow:0 0 12px rgba(var(--a-rgb),.8); }
.trilha .e b{ display:block; font-size:14px; padding-right:12px; } .trilha .e span{ display:block; font-size:12px; color:var(--sec); padding-right:14px; margin-top:4px; line-height:1.4; } .trilha .e.vt::after{ background:#E5484D; box-shadow:0 0 12px rgba(229,72,77,.8); }
.nota{ font-size:11.5px; color:var(--ter); margin-top:10px; }
.relov{ position:fixed; inset:0; z-index:60; background:rgba(5,7,6,.82); backdrop-filter:blur(6px); display:flex; flex-direction:column; padding:20px; } .relov .bar{ display:flex; gap:10px; justify-content:flex-end; max-width:1000px; width:100%; margin:0 auto 10px; } .relov iframe{ flex:1; width:100%; max-width:1000px; margin:0 auto; border:0; border-radius:14px; background:#fff; }
.banc > div{ display:grid; grid-template-columns:130px minmax(0,1fr) 30px 80px; gap:10px; align-items:center; padding:5px 0; font-size:13.5px; } .banc i{ height:10px; border-radius:5px; background:rgba(242,244,245,.18); } .banc .eu{ color:var(--a); font-weight:700; } .banc .eu i{ background:var(--a); box-shadow:0 0 10px rgba(var(--a-rgb),.6); } .banc b{ text-align:right; } .banc small{ color:var(--ter); font-size:11.5px; }
.cens{ display:grid; grid-template-columns:1fr 1fr; gap:12px; } .cen{ background:var(--sup2); border-radius:16px; padding:16px; } .cen > span{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ter); } .cen > b{ display:block; font:900 44px/1 "Inter"; color:var(--a); margin:6px 0 2px; } .cen small{ color:var(--ter); display:block; margin-bottom:8px; } .cen div{ font-size:13px; color:var(--sec); } .cen.vz{ border:1px dashed var(--linha); background:none; }
.saldo{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:10px; } .saldo div{ background:var(--sup2); border-radius:14px; padding:12px; } .saldo span{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ter); } .saldo b{ display:block; font-size:22px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums; } .saldo .pos b{ color:var(--a); } .saldo .neg b{ color:#E5484D; }
.barra{ height:6px; border-radius:3px; background:rgba(242,244,245,.08); margin-bottom:12px; overflow:hidden; } .barra i{ display:block; height:100%; background:var(--a); transition:width .4s; } .barra i.neg{ background:#E5484D; }
.gl{ display:grid; grid-template-columns:28px minmax(0,1fr) 190px 90px 220px; gap:8px; align-items:center; padding:5px 0; border-bottom:1px solid var(--linha); font-size:13px; } .gl > span:first-child{ color:var(--ter); font-size:12px; } .gl.on > span:first-child{ color:var(--a); font-weight:700; } .gl .vl{ text-align:right; font-variant-numeric:tabular-nums; } .gl .nv{ color:var(--ter); }
.gl input, .gl select{ font:13px "Inter"; color:var(--texto); background:#0F1314; border:1px solid var(--linha); border-radius:8px; padding:6px 8px; width:100%; } .gl.ch{ border-bottom:1px solid rgba(var(--a-rgb),.3); }
details.cas{ border-top:1px solid var(--linha); } details.cas summary{ list-style:none; display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:14px; padding:12px 2px; cursor:pointer; font-weight:700; } details.cas summary::-webkit-details-marker{ display:none; } details.cas summary i{ font-style:normal; color:var(--ter); font-weight:500; font-size:13px; } details.cas summary b{ color:var(--a); }
.pat > div{ position:relative; display:grid; grid-template-columns:150px auto; gap:2px 16px; padding:10px 0; border-bottom:1px solid var(--linha); overflow:hidden; } .pat span{ font-weight:700; } .pat b{ text-align:right; font-size:20px; font-variant-numeric:tabular-nums; } .pat small{ grid-column:1/-1; color:var(--ter); } .pat i{ position:absolute; left:0; bottom:0; height:2px; background:var(--a); } .pat .tot b{ color:var(--a); font-size:28px; }
@media (max-width:760px){ .saldo, .cens{ grid-template-columns:1fr 1fr; } .gl{ grid-template-columns:24px minmax(0,1fr) 120px; } .gl .vl, .gl select[data-op]{ grid-column:2/-1; } .banc > div{ grid-template-columns:100px minmax(0,1fr) 24px; } .banc small{ display:none; } }
@media (max-width:760px){ .tl4, .semana{ grid-template-columns:1fr 1fr; } }
.secnav{ position:sticky; top:56px; z-index:25; display:flex; gap:4px; justify-content:center; padding:8px 12px; background:rgba(11,15,13,.86); backdrop-filter:blur(10px); border-bottom:1px solid var(--linha); } .secnav a{ font:700 13px "Inter"; color:var(--sec); text-decoration:none; padding:7px 14px; border-radius:999px; } .secnav a.on{ color:#0B0D0E; background:var(--a); } .secnav a:first-child{ margin-right:auto; color:var(--ter); } .secnav a:first-child.on{ background:none; color:var(--a); }
.bloco > h3[data-bl]{ cursor:pointer; display:flex; align-items:center; gap:8px; } .bloco > h3[data-bl]::after{ content:"−"; margin-left:auto; color:var(--ter); font-weight:500; } .bloco.fech > h3::after{ content:"+"; } .bloco.fech > .blc{ display:none; } .bloco.fech{ padding-block:14px; }
.legg{ display:grid; grid-template-columns:minmax(220px,20%) minmax(0,1fr); gap:16px; margin-bottom:16px; } .legg .bloco{ margin-bottom:16px; } .legg > div:last-child > .bloco:last-child{ margin-bottom:0; }
ol.vt{ list-style:none; margin:6px 0 0; padding:0 0 0 18px; border-left:2px solid rgba(var(--a-rgb),.4); } ol.vt li{ position:relative; padding:0 0 14px 6px; } ol.vt li::before{ content:""; position:absolute; left:-25px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--a); box-shadow:0 0 10px rgba(var(--a-rgb),.7); } ol.vt li.rc::before{ background:var(--sup2); border:2px solid var(--ter); box-shadow:none; } ol.vt b{ display:block; font-size:14px; } ol.vt span{ font-size:12.5px; color:var(--sec); }
.trilha{ align-items:flex-start; } .trilha .e .alt{ margin-top:10px; display:flex; flex-direction:column; gap:6px; padding-left:10px; border-left:1px dashed rgba(242,244,245,.25); } .trilha .alt div{ font-size:12px; } .trilha .alt div b{ font-size:12.5px; padding:0; } .trilha .alt .s b{ color:#34C759; } .trilha .alt .n b{ color:#E5484D; } .trilha .alt span{ padding:0; margin:0; } .trilha .e.pz::after{ background:var(--sup2); border:2px solid var(--a); box-shadow:none; }
.ordc{ display:flex; gap:6px; align-items:center; margin-bottom:10px; flex-wrap:wrap; } .ordc .r{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ter); margin-right:4px; } .ordc button{ font:600 12px "Inter"; padding:6px 11px; border-radius:999px; border:1px solid var(--linha); background:none; color:var(--sec); cursor:pointer; } .ordc button.on{ color:#0B0D0E; background:var(--texto); }
.comp .cl{ display:grid; grid-template-columns:minmax(0,1fr) 130px minmax(0,1fr); align-items:center; gap:10px; padding:5px 0; } .comp .pn{ text-align:center; font-weight:700; font-size:13px; } .comp .pn small{ display:block; font-size:11px; color:var(--ter); font-weight:500; } .comp .eu .pn{ color:var(--a); }
.comp .lado{ display:flex; align-items:center; gap:8px; } .comp .lado.e{ flex-direction:row; justify-content:flex-end; } .comp .lado b{ font-size:13px; width:20px; text-align:center; color:var(--sec); } .comp .seg{ display:flex; gap:2px; width:100%; } .comp .lado.e .seg{ flex-direction:row-reverse; }
.comp .seg i{ position:relative; display:block; height:14px; min-width:4px; border-radius:3px; background:rgba(242,244,245,.22); animation:cresce .6s cubic-bezier(.2,.8,.3,1) both; } .comp .lado.d .seg i{ background:rgba(242,244,245,.32); } .comp .lado .seg i.perd{ background:#E5484D; } .comp .lado .seg i.ganh{ background:#34C759; box-shadow:0 0 8px rgba(52,199,89,.5); } .comp .eu .lado.d .seg i:not(.ganh){ background:var(--a); } .comp .lado.d{ flex-wrap:nowrap; }
.comp .seg i img{ position:absolute; left:50%; bottom:16px; transform:translateX(-50%); width:20px; height:20px; border-radius:50%; object-fit:cover; object-position:50% 18%; box-shadow:0 0 0 1.5px var(--fundo); } .comp .lado.d{ padding-top:20px; } .comp .cl.cab span{ font-size:10.5px; letter-spacing:.14em; color:var(--ter); } .comp .cl.cab .lado.d{ padding-top:0; }
@keyframes cresce{ from{ transform:scaleX(0); opacity:0; } } .comp .lado.e .seg i{ transform-origin:right; } .comp .lado.d .seg i{ transform-origin:left; }
.chips button.fixo{ cursor:default; box-shadow:inset 0 0 0 2px rgba(255,255,255,.35); }
