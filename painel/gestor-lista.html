<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link Gestor · emendas</title>
<meta name="robots" content="noindex,nofollow">
<style>
@font-face{font-family:"Inter";src:url(../fontes/InterVariable.woff2) format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box} button,input,select,textarea{font-family:inherit}
:root{--sf:#EEF0F2;--tl:#F8F9FA;--bd:#DEE2E5;--tx:#1D2226;--mu:#6E767D;--ok:#1FA845;--or:#E8822A;--az:#2F5D8A}
body{margin:0;background:var(--sf);color:var(--tx);font-family:Inter,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:18px 16px 110px}
.org{font-size:12.5px;color:var(--mu)}
.ihd{display:flex;align-items:center;gap:10px;margin:8px 0 14px;flex-wrap:wrap}.ihd h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}.ihd span{color:var(--mu);font-size:12.5px}
.ii{width:22px;height:22px;border-radius:50%;border:1px solid var(--bd);background:var(--tl);color:var(--mu);font-weight:600;font-size:12px;font-style:italic;cursor:pointer;padding:0}
.ipop{position:absolute;z-index:30;max-width:360px;background:var(--tl);border:1px solid var(--bd);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.14);padding:12px 14px;font-size:12.5px;line-height:1.5}
.ici{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-2px}
/* quadro da cota: mesmo padrão do painel de Indicação (barraSeg) */
.q5{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px}
.q5k{background:#F8F9FA;border:1px solid #DEE2E5;border-radius:16px;padding:16px 18px}
.q5k.ok{border-color:#BFE3C9}.q5k.ok .q5i{background:#DDF3E1;color:#17883A}.q5k.fl .q5i{background:#FDEBDD;color:#C0561B}
.q5t{display:flex;align-items:center;gap:10px}.q5t span{font:500 12.5px Inter;color:#6E767D;line-height:1.25}.q5t span b{display:block;color:#1D2226;font:600 14px Inter}
.q5i{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#E4E7E9;color:#3E454B;flex:none}
.q5i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.q5n{display:flex;align-items:baseline;gap:8px;margin:12px 0 10px;flex-wrap:wrap}
.q5n b{font:800 32px Inter;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums;color:#1D2226}.q5n small{font:400 12.5px Inter;color:#6E767D}
.q5c{margin-left:auto;font:700 11px Inter;border-radius:999px;padding:3px 9px;white-space:nowrap;background:#E4E7E9;color:#3E454B}
.q5c.ok{background:#DDF3E1;color:#17883A}.q5c.fl{background:#FDEBDD;color:#C0561B}
.q5b{position:relative;height:12px;border-radius:6px;background:#E4E7E9}.q5b.q5fino{height:8px;border-radius:4px}
.q5f{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;display:flex;gap:2px;overflow:hidden}.q5f i{display:block;height:100%}
.q5m{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:#E8822A;box-shadow:0 0 0 2px #F8F9FA}
.q5m.ok{background:#1FA845}
.q5ft{display:flex;justify-content:space-between;font:400 11.5px Inter;color:#6E767D;margin-top:6px;font-variant-numeric:tabular-nums}.q5ft em{font-style:normal;font-weight:700;color:#1D2226}
.q5s{margin-top:14px;padding-top:12px;border-top:1px dashed #DEE2E5}
.q5sh{display:flex;justify-content:space-between;align-items:center;gap:8px;font:400 12px Inter;color:#6E767D;margin-bottom:8px}.q5sh b{color:#1D2226;font-weight:600}
.q5sh .q5c{margin-left:0}
.q5l{display:flex;flex-wrap:wrap;gap:4px 14px;font:400 11.5px Inter;color:#3E454B;margin-top:7px;font-variant-numeric:tabular-nums}
.q5l i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}.q5l b{font-weight:600}
.dif{font:700 11px Inter;color:var(--or)}
/* quadro enxuto da cota (22/11) */
.qd{background:var(--tl);border:1px solid var(--bd);border-radius:16px;padding:16px 18px}
.qn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.qn span{display:block;font-size:11.5px;color:var(--mu)}
.qn b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.qn b em{font-style:normal;font-size:13px;font-weight:500;color:var(--mu);letter-spacing:0}
.qn b.pos{color:#17883A}.qn b.neg{color:#C0392B}
.qn small{display:block;font-size:11px;margin-top:2px}
.qb{position:relative;height:10px;border-radius:5px;background:#E4E7E9;margin:14px 0 6px;display:flex;gap:2px}
.qb i{display:block;height:100%;border-radius:5px}.qb i.s{background:#2A2F33}.qb i.f{background:#8E959B}
.qb b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:#E8822A;box-shadow:0 0 0 2px var(--tl)}
.ql{display:flex;gap:14px;font-size:11px;color:var(--mu)}.ql i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ql i.s{background:#2A2F33}.ql i.f{background:#8E959B}.ql i.m{background:#E8822A;width:3px}
.qm{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd)}
.mt{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--mu);padding:7px 12px 7px 8px;border-radius:12px;background:#fff;border:1px solid var(--bd);flex:1;min-width:200px}
.mt b{color:var(--tx);font-weight:600}.mt small{display:block;font-size:11px;margin-top:1px}
.mi{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.mt.ok .mi{background:#DDF3E1;color:#17883A}.mt.fl .mi{background:#FDEBDD;color:#C0561B}
.mt.fl small{color:#C0561B}
.selr{border:1px solid var(--bd);border-radius:999px;padding:8px 12px;font-size:12.5px;background:#fff;color:var(--tx);outline:none}
th[data-o]{cursor:pointer;user-select:none}th[data-o]:hover{color:var(--tx)}
@media(max-width:700px){.qn{grid-template-columns:1fr 1fr}}

/* segmentação (etiqueta % distribuição) */
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 0}
.cx{background:var(--tl);border:1px solid var(--bd);border-radius:14px;padding:12px 15px}
.cxh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.cxh b{font-size:13px;font-weight:600}.cxh span{font-size:11.5px;color:var(--mu)}
.br{display:grid;grid-template-columns:120px minmax(0,1fr) 46px 84px 24px;gap:8px;align-items:center;font-size:12px;padding:3px 4px;cursor:pointer;border-radius:6px}
.br:hover{background:#fff}.br.on{background:#fff;box-shadow:0 0 0 1px var(--bd)}
.br .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.br .t{height:8px;border-radius:5px;background:#E4E7E9;overflow:hidden}.br .t i{display:block;height:100%;background:#1D2226;border-radius:5px}
.br .p{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.br .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mu)}.br .q{color:var(--mu);font-size:11px;text-align:right}
.mais{font-size:11.5px;color:var(--mu);background:none;border:0;cursor:pointer;padding:4px 0 0;text-decoration:underline;text-underline-offset:2px}
/* barra de ferramentas e tabela */
.tool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}
.busca{flex:1;min-width:200px;border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font-size:13px;background:#fff;outline:none}
.etq{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--bd);cursor:pointer;color:var(--tx);display:inline-flex;gap:6px;align-items:center}
.etq.on{background:#1D2226;color:#fff;border-color:#1D2226}
.fil{font-size:12px;color:var(--az);font-weight:500}.fil button{background:none;border:0;color:var(--mu);cursor:pointer;text-decoration:underline}
.novab{width:36px;height:36px;border-radius:50%;border:0;background:#1FA845;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(31,168,69,.35)}
.novab .ici{width:18px;height:18px;stroke-width:2}
.novab:hover{background:#17883A}
.sheet{background:var(--tl);border:1px solid var(--bd);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th{font-size:11px;color:var(--mu);font-weight:500;text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;position:sticky;top:0;background:var(--tl)}
td{padding:8px;border-bottom:1px solid var(--bd);font-size:12.5px;vertical-align:top;line-height:1.4}
td.n{color:var(--mu);width:34px;text-align:right;font-variant-numeric:tabular-nums}
td.mu{width:140px;font-weight:500}td.mu small{display:block;color:var(--mu);font-weight:400;font-size:11px}
td.ob{min-width:300px}
td.vl{width:120px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
td.ld{width:110px}
td.ic{width:44px;text-align:center}
.icb{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:#E4E7E9;color:#3E454B}
.icb.vz{background:transparent;border:1px dashed #C9CED2;color:#B3B9BE;font-size:11px}
.icb.cap{background:#DCE6F0;color:#2F5D8A}.icb.cus{background:#E7EFF7;color:#5D86AD}
.mud{background:#FFF4E8;box-shadow:inset 0 0 0 1px #F4C79A;border-radius:6px}
span.mud{padding:1px 4px}
tr.nova td{background:#EEF8F0}tr.nova td.n{color:var(--ok);font-weight:700}
tr.exc td{opacity:.45}tr.exc td.ob,tr.exc td.mu,tr.exc td.vl{text-decoration:line-through}
td.ac{width:92px;white-space:nowrap;text-align:right}
.ab{width:30px;height:30px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--mu);display:inline-flex;align-items:center;justify-content:center}
.ab:hover{background:#fff;color:var(--tx)}.ab.lx:hover{color:#C0392B}
.tag{display:block;font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 7px;margin-top:4px;text-align:center}
.tag.m{background:#FDEBD8;color:#9A4E10}.tag.nw{background:#DDF3E1;color:#17883A}.tag.x{background:#FBE3DF;color:#B23A2A}
/* rodapé de envio */
.env{position:fixed;left:0;right:0;bottom:0;background:var(--tl);border-top:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:center;z-index:5}
.env > div{max-width:1180px;width:100%;display:flex;align-items:center;gap:14px}
.env .pr{flex:1;font-size:12.5px;color:var(--mu)}.env .pr b{color:var(--tx);font-weight:600;font-size:14px}
.bt{font-size:13px;font-weight:500;padding:9px 16px;border-radius:999px;background:#1D2226;color:#fff;border:0;cursor:pointer}.bt.s{background:#fff;color:var(--tx);border:1px solid var(--bd)}
.bt:disabled{opacity:.4;cursor:default}
/* caixas (card da emenda e confirmação) */
.cfp{position:fixed;inset:0;z-index:40;background:rgba(10,12,14,.35);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.cfb{background:var(--tl);border-radius:16px;padding:22px 24px 18px;max-width:440px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35);max-height:calc(100vh - 32px);overflow:auto}
.cfb.lg{max-width:560px}
.cfb > b{font-size:17px;font-weight:600}.cfb p{color:var(--mu);font-size:13px;margin:6px 0 10px;line-height:1.5}.cfb ul{font-size:12.5px;margin:0 0 16px;padding-left:18px;line-height:1.6}
.cfb .bb{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.vxb{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:#fff;color:var(--mu);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}.vxb.v{background:#1D2226;border-color:#1D2226;color:#fff}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:14px}
.fm label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--mu);font-weight:500}
.fm label.w{grid-column:1/-1}
.fm label i{font-style:normal;color:#C0392B}
.fm input,.fm textarea{border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font-size:13.5px;background:#fff;color:var(--tx);outline:none;font-weight:500}
.fm textarea{resize:vertical;min-height:64px;line-height:1.45}
.fm input:focus,.fm textarea:focus{border-color:#1D2226}
.fm .er{border-color:#E06A55;background:#FFF5F3}
.opc{display:flex;gap:6px;flex-wrap:wrap}
.opc button{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--tx)}
.opc button.on{background:#1D2226;color:#fff;border-color:#1D2226}
.sep{grid-column:1/-1;border-top:1px dashed var(--bd);padding-top:10px;font-size:11.5px;color:var(--mu)}
.msg{font-size:12px;color:#C0392B;margin-top:10px;min-height:16px}
.nota{font-size:12px;color:var(--mu);margin:14px 2px 0;line-height:1.5}
@media(max-width:900px){.q5{grid-template-columns:1fr}.seg2{grid-template-columns:1fr}.fm{grid-template-columns:1fr}}
/* v4 (22/11): metas clicáveis, + à direita, tabela com espaçamento único e cartões no celular */
.mt{cursor:pointer;align-items:center}.mt:hover{border-color:#B9C0C5}.mt.on{border-color:#1D2226;box-shadow:0 0 0 1px #1D2226}
.mt > span:nth-child(2){flex:1}.mv{color:var(--mu);font-size:12px}
.dt{margin-top:10px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.dn{font-size:12px;color:var(--mu);margin:8px 0 0}.dn b{color:var(--tx)}
.novab{margin-left:auto}
table{min-width:0;table-layout:auto}
th,td{padding:9px 10px}
th:first-child,td:first-child{padding-left:14px}th:last-child,td:last-child{padding-right:12px}
td.n{width:36px;padding-right:0;text-align:left}th[data-o="n"]{text-align:left !important}
td.mu{width:150px}
td.ob{min-width:0}
td.cl{width:78px;text-align:center;white-space:nowrap}td.cl .icb + .icb,td.cl span + span{margin-left:4px}
td.vl{width:112px}
td.ld{width:90px}
td.ac{width:70px}
.ab{width:28px;height:28px}
.tag{display:inline-block;margin:4px 0 0}
@media(max-width:700px){
  main{padding:12px 12px 110px}
  .qn b{font-size:17px}
  .br{grid-template-columns:90px minmax(0,1fr) 36px 70px 20px;gap:6px}
}
/* cartões (botão cartão/tabela, 22/11) */
.sheet.cards{overflow:visible;background:none;border:0}
.sheet.cards table,.sheet.cards tbody,.sheet.cards tr,.sheet.cards td{display:block}.sheet.cards thead{display:none}
.sheet.cards tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"mu mu vl" "ob ob ob" "cl ld ac";gap:6px 10px;background:var(--tl);border:1px solid var(--bd);border-radius:14px;padding:12px 12px 8px;margin-bottom:8px}
.sheet.cards td{border:0;padding:0 !important;width:auto !important}
.sheet.cards td.n{display:none}.sheet.cards td.mu{grid-area:mu}.sheet.cards td.vl{grid-area:vl;font-size:14px}.sheet.cards td.ob{grid-area:ob}
.sheet.cards td.cl{grid-area:cl;text-align:left}.sheet.cards td.ld{grid-area:ld;align-self:center;color:var(--mu)}.sheet.cards td.ac{grid-area:ac}
.sheet.cards td.mu small{display:inline;margin-left:6px}
.sheet.cards tr.nova{background:#EEF8F0}.sheet.cards tr.nova td{background:none}
@media(min-width:900px){.sheet.cards tbody{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}}
.sheet:not(.cards) table{min-width:760px}
/* cabeçalho com cronômetro na mesma linha; barra de ferramentas numa linha só; metas lado a lado */
.cab{display:flex;align-items:center;gap:12px;margin-bottom:14px}.cabt{flex:1;min-width:0}.cab .ihd{margin:6px 0 0;flex-wrap:nowrap}.cab .ihd h2{min-width:0}
.tool{flex-wrap:wrap}.busca{min-width:0;flex:1}.fil{order:9;flex-basis:100%}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:#fff;color:var(--tx);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.ib .ici{width:17px;height:17px}.ib:hover{border-color:#1D2226}.ib.on{background:#1D2226;color:#fff;border-color:#1D2226}
.novab{flex:none;width:38px;height:38px}
.qm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.qm .mt{min-width:0}
@media(max-width:700px){
  .cab .ihd h2{font-size:17px;line-height:1.2}.cab .ihd span{display:none}
  .gcr{flex-direction:column;align-items:flex-end;gap:3px;width:auto !important;margin:0 !important}.gcr .tk{font-size:10.5px;white-space:nowrap}
  .icd{gap:4px}.icd div{width:38px;padding:3px 0;border-radius:8px}.icd b{font-size:15px}.icd span{font-size:9px}
  .qm{gap:6px}.mt{flex-direction:column;align-items:flex-start !important;gap:4px;padding:8px 8px 7px;font-size:11px;position:relative}
  .mt b{font-size:12px;display:block}.mt small{font-size:10.5px}.mt .mi{width:18px;height:18px}.mv{position:absolute;right:7px;top:7px}
  .tool{gap:6px}.ib,.novab{width:36px;height:36px}
}
.icb{vertical-align:middle}
.sec{font-size:11.5px;font-weight:600;color:var(--tx);margin-bottom:-4px}.fm .w{grid-column:1/-1}
.ckg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{flex-direction:row !important;align-items:flex-start;gap:8px !important;border:1px solid var(--bd);border-radius:10px;padding:9px 10px;background:#fff;cursor:pointer}
.ck input{margin:2px 0 0;accent-color:#1D2226}.ck b{display:block;font-size:12.5px;color:var(--tx);font-weight:600}.ck small{font-size:11px;color:var(--mu);font-weight:400}
@media(max-width:700px){.ckg{grid-template-columns:1fr}}
/* Link Gestor: mudanças já enviadas e mensagens */
.pend{background:var(--tl);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-top:12px}
.pend > b{font-size:13px;font-weight:600;margin-right:8px}.pend > span{font-size:11.5px;color:var(--mu)}
.pend .pl{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--bd);margin-top:6px;font-size:12.5px}
.pend .pl .tag{margin:0;flex:none}.pend .pl .pt{flex:1;min-width:0}
.tag.ag{background:#E3EAF5;color:#2F5D8A;cursor:help}
.gcr{display:flex;align-items:center;gap:10px;flex:none}.gcr .tk{font-size:11.5px;color:var(--mu)}
.icd{display:flex;gap:6px}.icd div{background:#fff;border:1px solid var(--bd);border-radius:9px;width:52px;padding:5px 0;text-align:center}.icd b{display:block;font-size:18px;color:var(--or);font-variant-numeric:tabular-nums}.icd span{font-size:10px;color:var(--mu)}
.gfim{color:#C0392B;font-weight:600;font-size:13px}

/* quadro em duas leituras (23/11): área (Saúde × FUNDAM) e despesa (capital × custeio) */
.qinv{margin-top:12px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:#fff;cursor:pointer}.qinv:hover,.ar:hover{border-color:#B9C0C5}.qinv.on,.ar.on{border-color:#1D2226;box-shadow:0 0 0 1px #1D2226}
.ars{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--mu);margin-bottom:6px}.ars b{color:var(--tx);font-weight:600;white-space:nowrap}

const AREAS = [["Saúde", "sau"], ["Educação", "edu"], ["Agricultura", "agr"], ["Infraestrutura e Mobilidade", "inf"], ["Segurança Pública", "seg"], ["FUNDAM", "fun"], ["Fundo Social", "soc"]];
const NATS = [["Capital", "cap", "investimento"], ["Custeio", "cus", "custeio"]];
ICI.lapis = '<path d="M10.6 2.9l2.5 2.5-7.6 7.6-3.1.6.6-3.1z"/><path d="M9.2 4.3l2.5 2.5"/>';
const ici = (k) => `<svg class="ici" viewBox="0 0 16 16">${ICI[k] || ""}</svg>`;
let ORIG = [], ST = [];   // _st: "" | "m" alterado | "n" nova | "x" excluir
let FL = null, Q = "", DIST = false, ORD = null, MD = null, DP = [], verTodasR = false, verTodosL = false, nNova = 0;
const moeda = (v) => (+v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const rc = (v) => "R$ " + moeda(v);
const rcc = (v) => Math.abs(v) >= 1e6 ? "R$ " + (v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " mi" : "R$ " + Math.round(v / 1e3) + " mil";
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const numBR = (s) => +String(s || "").replace(/[^\d,]/g, "").replace(",", ".") || 0;
const CAMPOS = ["mun", "obj", "area", "nat", "v", "lid", "con"];
const vivas = () => ST.filter((x) => x._st !== "x");
const mudou = (x, c) => { const o = ORIG.find((y) => y.id === x.id); return !!o && x._st !== "n" && String(o[c] ?? "") !== String(x[c] ?? ""); };
const pend = () => ST.filter((x) => x._st);
const regDe = (x) => x.mun ? REG[x.mun] || "Outra" : "Sem município";

// quadro enxuto (pedido 22/11): uma faixa com cota, indicado, livre e emendas; uma barra; três metas em linha
function quadro(L) {
  // duas leituras separadas (pedido 23/11, como no painel de Indicação): ÁREA (Saúde × FUNDAM, metades da cota) e
  // DESPESA (capital/investimento × custeio, meta de 70% em investimento), esta no geral e dentro de cada área
  const val = (x) => +x.v || 0, tot = L.reduce((s, x) => s + val(x), 0), totO = ORIG.reduce((s, x) => s + val(x), 0);
  const grp = (f) => { const o = { cap: 0, cus: 0, def: 0, t: 0 }; L.filter(f).forEach((x) => { const k = x.nat === "Capital" ? "cap" : x.nat === "Custeio" ? "cus" : "def"; o[k] += val(x); o.t += val(x); }); return o; };
  const S = grp((x) => x.area === "Saúde"), F = grp((x) => x.area !== "Saúde"), A = { cap: S.cap + F.cap, cus: S.cus + F.cus, def: S.def + F.def, t: tot };
  const p = (v, d) => d ? (v / d * 100).toLocaleString("pt-BR", { maximumFractionDigits: 0 }) + "%" : "0%", livre = COTA - tot, mS = COTA * SAUDE, mF = COTA * (1 - SAUDE);
  const okS = S.t >= mS - .005, okF = F.t <= mF + .005, okC = tot && A.cap / tot >= META_CAP;
  const desp = (o, meta) => `<div class="qdb"><i class="cap" style="flex:${o.cap}"></i><i class="cus" style="flex:${o.cus}"></i><i class="def" style="flex:${o.def}"></i>${meta ? `<b style="left:${meta * 100}%" title="meta: ${Math.round(meta * 100)}% em investimento"></b>` : ""}</div>
    <div class="qdl"><span><i class="cap"></i>capital ${rcc(o.cap)}</span><span><i class="cus"></i>custeio ${rcc(o.cus)}</span>${o.def ? `<span><i class="def"></i>a definir ${rcc(o.def)}</span>` : ""}</div>`;
  const area = (k, nome, o, m, ok, sub, chip) => { const esc2 = Math.max(o.t, m) * 1.04 || 1;
    return `<div class="ar ${ok ? "ok" : "fl"}${MD === k ? " on" : ""}" data-md="${k}" role="button" title="Ver o detalhamento">
      <div class="arh"><span class="mi">${ok ? "✓" : "!"}</span><span class="arn"><b>${nome} ${p(o.t, COTA)}</b><small>${sub}</small></span><span class="chip ${ok ? "ok" : "fl"}">${chip}</span></div>
      <div class="arb"><i style="width:${(Math.min(o.t, esc2) / esc2 * 100).toFixed(1)}%"></i><b style="left:${(m / esc2 * 100).toFixed(1)}%"></b></div>
      <div class="ars"><span>Investimento e custeio</span><b>capital ${p(o.cap, o.t)}</b></div>${desp(o)}</div>`; };
  return `<div class="qd">
    <div class="qn"><div><span>Cota</span><b>${rcc(COTA)}</b></div>
      <div><span>Indicado</span><b>${rcc(tot)} <em>${p(tot, COTA)}</em></b>${tot !== totO ? `<small class="dif">${tot > totO ? "+" : "−"}${rcc(Math.abs(tot - totO))} nas mudanças</small>` : ""}</div>
      <div><span>${livre < 0 ? "Acima da cota" : "Livre"}</span><b class="${livre < 0 ? "neg" : "pos"}">${rcc(Math.abs(livre))}</b></div>
      <div><span>Emendas</span><b>${L.length} <em>de ${MAXE}</em></b></div></div>
    <div class="qb"><i class="s" style="width:${Math.min(100, tot / COTA * 100)}%"></i></div>
    <div class="qinv${MD === "inv" ? " on" : ""}" data-md="inv" role="button" title="Ver o detalhamento"><div class="ars"><span>Investimento e custeio · de tudo o que foi indicado</span><span class="chip ${okC ? "ok" : "fl"}">${okC ? "✓ " : ""}investimento ${p(A.cap, tot)} · meta ${Math.round(META_CAP * 100)}%</span></div>${desp(A, META_CAP)}</div>
    <div class="qar">${area("sau", "Saúde", S, mS, okS, `mínimo ${Math.round(SAUDE * 100)}% da cota`, okS ? "✓ atingido" : "faltam " + rcc(mS - S.t))}
      ${area("fun", "FUNDAM", F, mF, okF, `até ${Math.round((1 - SAUDE) * 100)}% · demais áreas`, okF ? "livre " + rcc(mF - F.t) : "acima em " + rcc(F.t - mF))}</div>
    ${MD ? detalhe(L, MD, tot, S.t, A.cap) : ""}</div>`;
}

// detalhamento de uma meta: linhas com valor, % e emendas; tocar numa linha filtra a tabela
function detalhe(L, k, tot, sau, cap) { const val = (x) => +x.v || 0, nd = (x) => x.nat === "Capital" ? "Investimento" : x.nat === "Custeio" ? "Custeio" : "Despesa a definir";
  let tit, nota, base, chave;
  if (k === "sau") { tit = "Saúde por despesa"; base = (x) => x.area === "Saúde"; chave = nd; const f = COTA * SAUDE - sau; nota = f > 0 ? `Para chegar ao mínimo faltam <b>${rcc(f)}</b> em Saúde.` : "Mínimo da Saúde atingido."; }
  else if (k === "inv") { tit = "Tudo o que foi indicado, por despesa"; base = () => true; chave = nd; const f = tot * META_CAP - cap; nota = f > 0 ? `Para a meta de ${Math.round(META_CAP * 100)}% faltam <b>${rcc(f)}</b> em investimento. Definir a despesa das emendas "a definir" pode resolver boa parte.` : "Meta de investimento atingida."; }
  else { tit = "FUNDAM por área"; base = (x) => x.area !== "Saúde"; chave = (x) => x.area || "Área a definir"; const l = COTA * (1 - SAUDE) - (tot - sau); nota = l >= 0 ? `Ainda cabem <b>${rcc(l)}</b> nas áreas fora da Saúde.` : `As áreas fora da Saúde passaram <b>${rcc(-l)}</b> da metade da cota.`; }
  const G = {}; L.filter(base).forEach((x) => { const c = chave(x); (G[c] = G[c] || { v: 0, n: 0 }); G[c].v += val(x); G[c].n++; });
  const E = Object.entries(G).sort((a, b) => b[1].v - a[1].v), soma = E.reduce((s, e) => s + e[1].v, 0), max = E.length ? E[0][1].v : 1;
  DP = E.map(([c]) => [c, (x) => base(x) && chave(x) === c]);
  return `<div class="dt"><div class="cxh"><b>${tit}</b><span>% · valor · emendas · toque para ver na tabela</span></div>${E.map(([c, g], j) => `<div class="br${FL && FL[0] === "p" && FL[1] === c ? " on" : ""}" data-p="${j}"><span class="n">${esc(c)}</span><span class="t"><i style="width:${g.v / max * 100}%"></i></span><span class="p">${soma ? Math.round(g.v / soma * 100) : 0}%</span><span class="v">${rcc(g.v)}</span><span class="q">${g.n}</span></div>`).join("")}<p class="dn">${nota}</p></div>`; }

// ---------- distribuição por região e por líder (etiqueta % distribuição) ----------
function grupoPor(L, chave) { const G = {}; L.forEach((x) => { const k = chave(x) || "Sem líder"; (G[k] = G[k] || { v: 0, n: 0 }); G[k].v += +x.v || 0; G[k].n++; }); return Object.entries(G).sort((a, b) => b[1].v - a[1].v); }
function barras(G, tipo, todas, tot) { const max = G.length ? G[0][1].v : 1, L = todas ? G : G.slice(0, 7);
  return L.map(([n, g]) => `<div class="br${FL && FL[0] === tipo && FL[1] === n ? " on" : ""}" data-f="${tipo}|${esc(n)}"><span class="n">${esc(n)}</span><span class="t"><i style="width:${g.v / max * 100}%"></i></span><span class="p">${tot ? (g.v / tot * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) : 0}%</span><span class="v">${rcc(g.v)}</span><span class="q">${g.n}</span></div>`).join("") + (G.length > 7 ? `<button class="mais" data-mais="${tipo}">${todas ? "mostrar menos" : `ver todas (${G.length})`}</button>` : ""); }

const icArea = (x) => { const a = AREAS.find((q) => q[0] === x.area); return a ? `<span class="icb" title="${esc(a[0])}">${ici(a[1])}</span>` : `<span class="icb vz" title="Área a definir">—</span>`; };
const icNat = (x) => { const a = NATS.find((q) => q[0] === x.nat); return a ? `<span class="icb ${a[1]}" title="${a[0]} (${a[2]})">${ici(a[1])}</span>` : `<span class="icb vz" title="Despesa a definir">—</span>`; };
const cel = (x, c, h) => mudou(x, c) ? `<span class="mud">${h}</span>` : h;

function render() { const L = vivas(), tot = L.reduce((s, x) => s + (+x.v || 0), 0), P = pend();
  const GR = grupoPor(L, regDe), GL = grupoPor(L, (x) => x.lid);
  const vis = ST.map((x, i) => [x, i]).filter(([x]) => (!FL || (FL[0] === "p" ? FL[2](x) : (FL[0] === "r" ? regDe(x) : x.lid || "Sem líder") === FL[1])) && (!Q || norm(CAMPOS.map((c) => x[c]).join(" ") + " " + regDe(x)).includes(norm(Q))));
  if (ORD) { const [c, d] = ORD, k = (x) => c === "n" ? (x._st === "n" ? -1 : ORIG.findIndex((o) => o.id === x.id)) : c === "v" ? +x.v || 0 : c === "reg" ? norm(regDe(x)) : norm(x[c] || ""); vis.sort((a, b) => { const A = k(a[0]), B = k(b[0]); return (A > B ? 1 : A < B ? -1 : 0) * d; }); }
  document.getElementById("app").innerHTML = `<div class="cab"><div class="cabt"><div class="org">${esc(GAB)}</div>
  <div class="ihd"><h2>${esc(NOMEL)}</h2><span>Link Gestor</span><button class="ii" data-info>i</button></div></div><div class="gcr" id="gcr">${cronometro()}</div></div>
  ${quadro(L)}
  ${DIST ? `<div class="seg2"><div class="cx"><div class="cxh"><b>Por região</b><span>associação de municípios · % · valor · emendas</span></div>${barras(GR, "r", verTodasR, tot)}</div>
    <div class="cx"><div class="cxh"><b>Por líder</b><span>% · valor · emendas</span></div>${barras(GL, "l", verTodosL, tot)}</div></div>` : ""}
  <div class="tool"><input class="busca" id="q" placeholder="Buscar município, região, objeto, líder…" value="${esc(Q)}"><button class="ib${DIST ? " on" : ""}" data-dist title="% distribuição por região e líder" aria-label="% distribuição">${ici("pizza")}</button>${FL ? `<span class="fil">${FL[0] === "r" ? "Região" : FL[0] === "p" ? "Filtro" : "Líder"}: ${esc(FL[1])} · <button data-sf>tirar filtro</button></span>` : ""}<button class="ib" data-imp title="Imprimir" aria-label="Imprimir">${ici("impr")}</button><button class="ib" data-vis title="${CARDS ? "Ver em tabela" : "Ver em cartões"}" aria-label="${CARDS ? "Ver em tabela" : "Ver em cartões"}">${ici(CARDS ? "tabela" : "cartoes")}</button>${ABERTO ? `<button class="novab" data-nova title="Nova emenda" aria-label="Nova emenda">${ici("mais")}</button>` : ""}</div>
  <div class="sheet${CARDS ? " cards" : ""}"><table><thead><tr><th data-o="n" style="text-align:right">Nº${ORD && ORD[0] === "n" ? (ORD[1] > 0 ? " ▲" : " ▼") : ""}</th><th data-o="mun">Município${ORD && ORD[0] === "mun" ? (ORD[1] > 0 ? " ▲" : " ▼") : ""}</th><th data-o="obj">Objeto${ORD && ORD[0] === "obj" ? (ORD[1] > 0 ? " ▲" : " ▼") : ""}</th><th data-o="area" style="text-align:center">Área · desp.${ORD && ORD[0] === "area" ? (ORD[1] > 0 ? " ▲" : " ▼") : ""}</th><th data-o="v" style="text-align:right">Valor (R$)${ORD && ORD[0] === "v" ? (ORD[1] > 0 ? " ▲" : " ▼") : ""}</th><th data-o="lid">Líder${ORD && ORD[0] === "lid" ? (ORD[1] > 0 ? " ▲" : " ▼") : ""}</th><th></th></tr></thead><tbody>
  ${vis.map(([x, i]) => `<tr class="${x._st === "n" ? "nova" : x._st === "x" ? "exc" : ""}" data-i="${i}"><td class="n">${x._st === "n" ? "+" : ORIG.findIndex((o) => o.id === x.id) + 1}</td>
    <td class="mu">${cel(x, "mun", esc(x.mun || "—"))}<small>${esc(x.mun ? REG[x.mun] || "" : "")}</small>${x._st === "m" ? `<span class="tag m">alterada</span>` : x._st === "n" ? `<span class="tag nw">nova</span>` : x._st === "x" ? `<span class="tag x">excluir</span>` : ""}</td>
    <td class="ob">${cel(x, "obj", esc(x.obj || "—"))}</td>
    <td class="cl">${cel(x, "area", icArea(x))}${cel(x, "nat", icNat(x))}</td>
    <td class="vl">${cel(x, "v", moeda(x.v))}</td>
    <td class="ld">${cel(x, "lid", esc(x.lid || "—"))}</td>
    <td class="ac">${pendDe(x) ? `<span class="tag ag" title="${esc(pendTxt(pendDe(x)))}">enviada</span>` : ""}${x._st === "x" || x._st === "m" ? `<button class="ab" data-des title="Desfazer">↺</button>` : ""}${x._st !== "x" && ABERTO ? `<button class="ab" data-ed title="Editar">${ici("lapis")}</button><button class="ab lx" data-del title="${x._st === "n" ? "Tirar esta emenda nova" : "Excluir"}">${ici("lixo")}</button>` : ""}</td></tr>`).join("")}
  </tbody></table></div>
  ${pendHtml()}<p class="nota">${ABERTO ? "Nada é gravado direto na lista: as mudanças ficam marcadas (laranja = alterado, verde = nova, riscado = excluir) e seguem juntas para o gabinete validar. O quadro de cima já mostra o efeito das mudanças. Esta página lê a lista do gabinete cada vez que é aberta ou atualizada." : "Este link está fechado: a lista aparece só para consulta. Peça ao gabinete para reabrir se precisar mudar algo."}</p>`;
  document.getElementById("env")?.remove();
  const nm = P.filter((x) => x._st === "m").length, nn = P.filter((x) => x._st === "n").length, nx = P.filter((x) => x._st === "x").length;
  document.body.insertAdjacentHTML("beforeend", `<div class="env" id="env"><div><div class="pr">${P.length ? `<b>${P.length} ${P.length === 1 ? "mudança" : "mudanças"}</b> aguardando envio · ${[nm && nm + " alterada" + (nm > 1 ? "s" : ""), nn && nn + " nova" + (nn > 1 ? "s" : ""), nx && nx + " para excluir"].filter(Boolean).join(" · ")}` : (ABERTO ? (PEND.length ? `Nenhuma mudança nova · ${PEND.length} enviada${PEND.length > 1 ? "s" : ""} aguardando o gabinete` : "Nenhuma mudança ainda") : "Link fechado · só consulta")}</div>${P.length ? `<button class="bt s" data-desall>Desfazer tudo</button>` : ""}<button class="bt" data-env ${P.length ? "" : "disabled"}>Enviar para validação</button></div></div>`);
  liga(); }
const redesenha = () => { const y = scrollY; render(); scrollTo(0, y); };

// ---------- card da emenda (nova ou editar): valor, objeto e líder obrigatórios ----------
function card(i) { const x = i == null ? { area: null, nat: null } : ST[i], nova = i == null;
  let area = x.area, nat = x.nat;
  document.body.insertAdjacentHTML("beforeend", `<div class="cfp" id="cd"><div class="cfb lg"><b>${nova ? "Nova emenda" : "Editar emenda"}</b><p>${nova ? "Os campos com <b style='color:#C0392B'>*</b> são obrigatórios: valor, objeto e líder. O resto pode ficar para depois." : "As alterações ficam marcadas até o gabinete validar."}</p>
    <div class="fm">
      <label><span>Valor (R$) <i>*</i></span><input id="f_v" inputmode="numeric" placeholder="0,00" value="${x.v ? moeda(x.v) : ""}"></label>
      <label><span>Líder <i>*</i></span><input id="f_lid" list="lids" placeholder="Nome do líder" value="${esc(x.lid || (nova && FL && FL[0] === "l" ? FL[1] : ""))}"></label>
      <label class="w"><span>Objeto <i>*</i></span><textarea id="f_obj" placeholder="O que a emenda vai custear">${esc(x.obj || "")}</textarea></label>
      <div class="sep">Opcional</div>
      <label>Município<input id="f_mun" list="muns" placeholder="Município" value="${esc(x.mun || "")}"></label>
      <label>Contato<input id="f_con" placeholder="Nome e cargo" value="${esc(x.con || "")}"></label>
      <label class="w">Área<div class="opc" id="f_area">${AREAS.map(([n, k]) => `<button type="button" data-a="${esc(n)}" class="${n === area ? "on" : ""}">${ici(k)}${n}</button>`).join("")}</div></label>
      <label class="w">Despesa<div class="opc" id="f_nat">${NATS.map(([n, k, d]) => `<button type="button" data-n="${n}" class="${n === nat ? "on" : ""}">${ici(k)}${n === "Capital" ? "Capital · investimento" : n}</button>`).join("")}</div></label>
    </div><div class="msg" id="f_msg"></div>
    <div class="bb"><button class="vxb" data-x title="Cancelar">✕</button><button class="vxb v" data-v title="Confirmar">✓</button></div></div></div>`);
  const w = document.getElementById("cd"), $ = (s) => w.querySelector(s);
  w.querySelectorAll("[data-a]").forEach((b) => b.onclick = () => { area = area === b.dataset.a ? null : b.dataset.a; w.querySelectorAll("[data-a]").forEach((o) => o.classList.toggle("on", o.dataset.a === area)); });
  w.querySelectorAll("[data-n]").forEach((b) => b.onclick = () => { nat = nat === b.dataset.n ? null : b.dataset.n; w.querySelectorAll("[data-n]").forEach((o) => o.classList.toggle("on", o.dataset.n === nat)); });
  const fecha = () => { w.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = (e) => { if (e.key === "Escape") fecha(); };
  document.addEventListener("keydown", tecla);
  $("[data-x]").onclick = fecha;
  $("[data-v]").onclick = () => { const v = numBR($("#f_v").value), obj = $("#f_obj").value.trim(), lid = $("#f_lid").value.trim();
    [["#f_v", v > 0], ["#f_obj", obj], ["#f_lid", lid]].forEach(([s, ok]) => $(s).classList.toggle("er", !ok));
    if (!(v > 0 && obj && lid)) { $("#f_msg").textContent = "Falta preencher: " + [!(v > 0) && "valor", !obj && "objeto", !lid && "líder"].filter(Boolean).join(", ") + "."; return; }
    const d = { v, obj, lid, mun: $("#f_mun").value.trim() || null, con: $("#f_con").value.trim() || null, area, nat };
    if (nova) ST.unshift({ id: "novo" + ++nNova, ...d, _st: "n" });
    else { Object.assign(x, d); if (x._st !== "n") x._st = CAMPOS.some((k) => mudou(x, k)) ? "m" : ""; }
    fecha(); redesenha(); };
  (nova ? $("#f_v") : $("#f_obj")).focus(); }

function liga() { const A = document.getElementById("app");
  A.querySelectorAll("tr[data-i]").forEach((tr) => { const i = +tr.dataset.i, x = ST[i];
    const e = tr.querySelector("[data-ed]"); if (e) e.onclick = () => card(i);
    const d = tr.querySelector("[data-del]"); if (d) d.onclick = () => { if (x._st === "n") ST.splice(i, 1); else x._st = "x"; redesenha(); };
    const u = tr.querySelector("[data-des]"); if (u) u.onclick = () => { Object.assign(x, ORIG.find((o) => o.id === x.id), { _st: "" }); redesenha(); }; });
  A.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { const [t, n] = b.dataset.f.split("|"); FL = FL && FL[0] === t && FL[1] === n ? null : [t, n]; redesenha(); });
  A.querySelectorAll("[data-mais]").forEach((b) => b.onclick = () => { if (b.dataset.mais === "r") verTodasR = !verTodasR; else verTodosL = !verTodosL; redesenha(); });
  A.querySelectorAll("[data-md]").forEach((b) => b.onclick = () => { MD = MD === b.dataset.md ? null : b.dataset.md; redesenha(); });

function pendHtml() { if (!PEND.length) return "";
  const nome = (p) => { const x = ORIG.find((y) => y.id === p.item_id), d = p.dados || {}; return p.acao === "incluir" ? `Nova · ${esc(d.municipio || "sem município")} · ${esc(d.objeto || "")} · ${rc(d.valor || 0)}` : `${p.acao === "excluir" ? "Excluir" : "Alterar"} · ${esc(x ? x.mun || "—" : "emenda")} · ${esc(x ? x.obj || "" : "")}`; };
  return `<div class="pend"><b>Enviadas, aguardando o gabinete</b><span>${PEND.length} ${PEND.length === 1 ? "mudança" : "mudanças"} · o gabinete aceita ou recusa cada uma</span>${PEND.map((p) => `<div class="pl"><span class="tag ${p.acao === "incluir" ? "nw" : p.acao === "excluir" ? "x" : "m"}">${p.acao === "incluir" ? "nova" : p.acao === "excluir" ? "excluir" : "alterada"}</span><span class="pt">${nome(p)}</span>${ABERTO ? `<button class="ab lx" data-desiste="${p.id}" title="Desistir desta mudança">${ici("x")}</button>` : ""}</div>`).join("")}</div>`; }
async function desistir(id) { if (!confirm("Desistir desta mudança enviada?")) return; try { await rpc("gestor_desistir", { p_token: TOKEN, p_id: id }); await carregar(); } catch (e) { alert("Não foi possível: " + (e.message || e)); } }
async function carregar() { const l = await rpc("gestor_abrir", { p_token: TOKEN }); if (!l) throw new Error("link inválido");
  LK = l; ABERTO = !!l.aberto; PEND = l.pendentes || []; const c = l.cota || {}; COTA = +c.disp || 0; MAXE = +c.max || 0; SAUDE = c.saude != null ? +c.saude : .5;
  NOMEL = "Emendas " + (l.lista || ""); GAB = String(l.titulo || "").split(" · ")[0]; document.title = NOMEL + " · Link Gestor";
  ORIG = (l.itens || []).map(doBanco); ST = ORIG.map((x) => ({ ...x, _st: "" }));
  document.getElementById("muns").innerHTML = Object.keys(REG).sort().map((m) => `<option value="${esc(m)}">`).join("");
  document.getElementById("lids").innerHTML = [...new Set(ORIG.map((x) => x.lid).filter(Boolean))].sort().map((m) => `<option value="${esc(m)}">`).join("");
  redesenha(); }
(async () => { const A = document.getElementById("app");
  if (!TOKEN) { A.innerHTML = '<div class="erro"><b>Link incompleto</b>Peça ao gabinete o link completo.</div>'; return; }
  A.innerHTML = '<p class="nota">Abrindo a lista…</p>';
  try { await carregar(); } catch (e) { A.innerHTML = `<div class="erro"><b>Não foi possível abrir</b>${/inválido/.test(e.message) ? "Este link não existe ou foi apagado pelo gabinete." : esc(e.message || e)}</div>`; } })();
</script></body></html>
