<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link Gestor · emendas</title>
<meta name="robots" content="noindex,nofollow">
<style>
@font-face{font-family:"Inter";src:url(../fontes/InterVariable.woff2) format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box} button,input,select,textarea{font-family:inherit}
:root{--sf:#EEF0F2;--tl:#F8F9FA;--bd:#DEE2E5;--tx:#1D2226;--mu:#6E767D;--ok:#1FA845;--or:#E8822A;--az:#2F5D8A}
body{margin:0;background:var(--sf);color:var(--tx);font-family:Inter,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:18px 16px 110px}
.org{font-size:12.5px;color:var(--mu)}
.ihd{display:flex;align-items:center;gap:10px;margin:8px 0 14px;flex-wrap:wrap}.ihd h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}.ihd span{color:var(--mu);font-size:12.5px}
.ii{width:22px;height:22px;border-radius:50%;border:1px solid var(--bd);background:var(--tl);color:var(--mu);font-weight:600;font-size:12px;font-style:italic;cursor:pointer;padding:0}
.ipop{position:absolute;z-index:30;max-width:360px;background:var(--tl);border:1px solid var(--bd);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.14);padding:12px 14px;font-size:12.5px;line-height:1.5}
.ici{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-2px}
/* quadro da cota: mesmo padrão do painel de Indicação (barraSeg) */
.q5{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px}
.q5k{background:#F8F9FA;border:1px solid #DEE2E5;border-radius:16px;padding:16px 18px}
.q5k.ok{border-color:#BFE3C9}.q5k.ok .q5i{background:#DDF3E1;color:#17883A}.q5k.fl .q5i{background:#FDEBDD;color:#C0561B}
.q5t{display:flex;align-items:center;gap:10px}.q5t span{font:500 12.5px Inter;color:#6E767D;line-height:1.25}.q5t span b{display:block;color:#1D2226;font:600 14px Inter}
.q5i{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#E4E7E9;color:#3E454B;flex:none}
.q5i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.q5n{display:flex;align-items:baseline;gap:8px;margin:12px 0 10px;flex-wrap:wrap}
.q5n b{font:800 32px Inter;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums;color:#1D2226}.q5n small{font:400 12.5px Inter;color:#6E767D}
.q5c{margin-left:auto;font:700 11px Inter;border-radius:999px;padding:3px 9px;white-space:nowrap;background:#E4E7E9;color:#3E454B}
.q5c.ok{background:#DDF3E1;color:#17883A}.q5c.fl{background:#FDEBDD;color:#C0561B}
.q5b{position:relative;height:12px;border-radius:6px;background:#E4E7E9}.q5b.q5fino{height:8px;border-radius:4px}
.q5f{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;display:flex;gap:2px;overflow:hidden}.q5f i{display:block;height:100%}
.q5m{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:#E8822A;box-shadow:0 0 0 2px #F8F9FA}
.q5m.ok{background:#1FA845}
.q5ft{display:flex;justify-content:space-between;font:400 11.5px Inter;color:#6E767D;margin-top:6px;font-variant-numeric:tabular-nums}.q5ft em{font-style:normal;font-weight:700;color:#1D2226}
.q5s{margin-top:14px;padding-top:12px;border-top:1px dashed #DEE2E5}
.q5sh{display:flex;justify-content:space-between;align-items:center;gap:8px;font:400 12px Inter;color:#6E767D;margin-bottom:8px}.q5sh b{color:#1D2226;font-weight:600}
.q5sh .q5c{margin-left:0}
.q5l{display:flex;flex-wrap:wrap;gap:4px 14px;font:400 11.5px Inter;color:#3E454B;margin-top:7px;font-variant-numeric:tabular-nums}
.q5l i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}.q5l b{font-weight:600}
.dif{font:700 11px Inter;color:var(--or)}
/* quadro enxuto da cota (22/11) */
.qd{background:var(--tl);border:1px solid var(--bd);border-radius:16px;padding:16px 18px}
.qn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.qn span{display:block;font-size:11.5px;color:var(--mu)}
.qn b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.qn b em{font-style:normal;font-size:13px;font-weight:500;color:var(--mu);letter-spacing:0}
.qn b.pos{color:#3D7A61}.qn b.neg{color:#A65A2C}
.qn small{display:block;font-size:11px;margin-top:2px}
.qb{position:relative;height:10px;border-radius:5px;background:#E9EDF1;margin:14px 0 6px;display:flex;gap:2px}
.qb i{display:block;height:100%;border-radius:5px}.qb i.s{background:#34506B}.qb i.f{background:#93A3B3}
.qb b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:#C2703D;box-shadow:0 0 0 2px var(--tl)}
.ql{display:flex;gap:14px;font-size:11px;color:var(--mu)}.ql i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ql i.s{background:#2A2F33}.ql i.f{background:#8E959B}.ql i.m{background:#E8822A;width:3px}
.qm{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd)}
.mt{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--mu);padding:7px 12px 7px 8px;border-radius:12px;background:#fff;border:1px solid var(--bd);flex:1;min-width:200px}
.mt b{color:var(--tx);font-weight:600}.mt small{display:block;font-size:11px;margin-top:1px}
.mi{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.mt.ok .mi{background:#DDF3E1;color:#17883A}.mt.fl .mi{background:#FDEBDD;color:#C0561B}
.mt.fl small{color:#C0561B}
.selr{border:1px solid var(--bd);border-radius:999px;padding:8px 12px;font-size:12.5px;background:#fff;color:var(--tx);outline:none}
th[data-o]{cursor:pointer;user-select:none}th[data-o]:hover{color:var(--tx)}
@media(max-width:700px){.qn{grid-template-columns:1fr 1fr}}

/* segmentação (etiqueta % distribuição) */
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 0}
.cx{background:var(--tl);border:1px solid var(--bd);border-radius:14px;padding:12px 15px}
.cxh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.cxh b{font-size:13px;font-weight:600}.cxh span{font-size:11.5px;color:var(--mu)}
.br{display:grid;grid-template-columns:120px minmax(0,1fr) 46px 84px 24px;gap:8px;align-items:center;font-size:12px;padding:3px 4px;cursor:pointer;border-radius:6px}
.br:hover{background:#fff}.br.on{background:#fff;box-shadow:0 0 0 1px var(--bd)}
.br .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.br .t{height:8px;border-radius:5px;background:#E4E7E9;overflow:hidden}.br .t i{display:block;height:100%;background:#1D2226;border-radius:5px}
.br .p{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.br .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mu)}.br .q{color:var(--mu);font-size:11px;text-align:right}
.mais{font-size:11.5px;color:var(--mu);background:none;border:0;cursor:pointer;padding:4px 0 0;text-decoration:underline;text-underline-offset:2px}
/* barra de ferramentas e tabela */
.tool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}
.busca{flex:1;min-width:200px;border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font-size:13px;background:#fff;outline:none}
.etq{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--bd);cursor:pointer;color:var(--tx);display:inline-flex;gap:6px;align-items:center}
.etq.on{background:#1D2226;color:#fff;border-color:#1D2226}
.fil{font-size:12px;color:var(--az);font-weight:500}.fil button{background:none;border:0;color:var(--mu);cursor:pointer;text-decoration:underline}
.novab{width:36px;height:36px;border-radius:50%;border:0;background:#1FA845;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(31,168,69,.35)}
.novab .ici{width:18px;height:18px;stroke-width:2}
.novab:hover{background:#17883A}
.sheet{background:var(--tl);border:1px solid var(--bd);border-radius:14px;overflow:auto}
/* cabeçalho da tabela fica fixo ao rolar (24/11/2026): no computador a tabela não rola por dentro (clip) e o título gruda no topo da
   página; no celular, onde a tabela rola de lado, ela ganha altura máxima e o título gruda dentro dela */
.sheet:not(.cards) thead th{z-index:4;box-shadow:0 1px 0 var(--bd)}
@media(min-width:1000px){.sheet:not(.cards){overflow:clip}}
@media(max-width:999px){.sheet:not(.cards){max-height:78vh}}
table{width:100%;border-collapse:collapse;min-width:900px}
th{font-size:11px;color:var(--mu);font-weight:500;text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;position:sticky;top:0;background:var(--tl)}
td{padding:8px;border-bottom:1px solid var(--bd);font-size:12.5px;vertical-align:top;line-height:1.4}
td.n{color:var(--mu);width:34px;text-align:right;font-variant-numeric:tabular-nums}
td.mu{width:140px;font-weight:500}td.mu small{display:block;color:var(--mu);font-weight:400;font-size:11px}
td.ob{min-width:300px}
td.vl{width:120px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
td.ld{width:110px}
td.ic{width:44px;text-align:center}
.icb{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:#E4E7E9;color:#3E454B}
.icb.vz{background:transparent;border:1px dashed #C9CED2;color:#B3B9BE;font-size:11px}
.icb.cap{background:#DCE6F0;color:#2F5D8A}.icb.cus{background:#E7EFF7;color:#5D86AD}
.mud{background:#FFF4E8;box-shadow:inset 0 0 0 1px #F4C79A;border-radius:6px}
span.mud{padding:1px 4px}
tr.nova td{background:#EEF8F0}tr.nova td.n{color:var(--ok);font-weight:700}
tr.exc td{opacity:.45}tr.exc td.ob,tr.exc td.mu,tr.exc td.vl{text-decoration:line-through}
td.ac{width:92px;white-space:nowrap;text-align:right}
.ab{width:30px;height:30px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--mu);display:inline-flex;align-items:center;justify-content:center}
.ab:hover{background:#fff;color:var(--tx)}.ab.lx:hover{color:#C0392B}
.tag{display:block;font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 7px;margin-top:4px;text-align:center}
.tag.m{background:#FDEBD8;color:#9A4E10}.tag.nw{background:#DDF3E1;color:#17883A}.tag.x{background:#FBE3DF;color:#B23A2A}
/* rodapé de envio */
.env{position:fixed;left:0;right:0;bottom:0;background:var(--tl);border-top:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:center;z-index:5}
.env > div{max-width:1180px;width:100%;display:flex;align-items:center;gap:14px}
.env .pr{flex:1;font-size:12.5px;color:var(--mu)}.env .pr b{color:var(--tx);font-weight:600;font-size:14px}
.bt{font-size:13px;font-weight:500;padding:9px 16px;border-radius:999px;background:#1D2226;color:#fff;border:0;cursor:pointer}.bt.s{background:#fff;color:var(--tx);border:1px solid var(--bd)}
.bt:disabled{opacity:.4;cursor:default}
/* caixas (card da emenda e confirmação) */
.cfp{position:fixed;inset:0;z-index:40;background:rgba(10,12,14,.35);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.cfb{background:var(--tl);border-radius:16px;padding:22px 24px 18px;max-width:440px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35);max-height:calc(100vh - 32px);overflow:auto}
.cfb.lg{max-width:560px}
.cfb > b{font-size:17px;font-weight:600}.cfb p{color:var(--mu);font-size:13px;margin:6px 0 10px;line-height:1.5}.cfb ul{font-size:12.5px;margin:0 0 16px;padding-left:18px;line-height:1.6}
.cfb .bb{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.vxb{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:#fff;color:var(--mu);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}.vxb.v{background:#1D2226;border-color:#1D2226;color:#fff}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:14px}
.fm label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--mu);font-weight:500}
.fm label.w{grid-column:1/-1}
.fm label i{font-style:normal;color:#C0392B}
.fm input,.fm textarea{border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font-size:13.5px;background:#fff;color:var(--tx);outline:none;font-weight:500}
.fm textarea{resize:vertical;min-height:64px;line-height:1.45}
.fm input:focus,.fm textarea:focus{border-color:#1D2226}
.fm .er{border-color:#E06A55;background:#FFF5F3}
.opc{display:flex;gap:6px;flex-wrap:wrap}
.opc button{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--tx)}
.opc button.on{background:#1D2226;color:#fff;border-color:#1D2226}
.sep{grid-column:1/-1;border-top:1px dashed var(--bd);padding-top:10px;font-size:11.5px;color:var(--mu)}
.msg{font-size:12px;color:#C0392B;margin-top:10px;min-height:16px}
.nota{font-size:12px;color:var(--mu);margin:14px 2px 0;line-height:1.5}
@media(max-width:900px){.q5{grid-template-columns:1fr}.seg2{grid-template-columns:1fr}.fm{grid-template-columns:1fr}}
/* v4 (22/11): metas clicáveis, + à direita, tabela com espaçamento único e cartões no celular */
.mt{cursor:pointer;align-items:center}.mt:hover{border-color:#B9C0C5}.mt.on{border-color:#1D2226;box-shadow:0 0 0 1px #1D2226}
.mt > span:nth-child(2){flex:1}.mv{color:var(--mu);font-size:12px}
.dt{margin-top:10px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.dn{font-size:12px;color:var(--mu);margin:8px 0 0}.dn b{color:var(--tx)}
.novab{margin-left:auto}
.ib .ibx{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ib[data-com] svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.ib[data-com].on{background:#1D2226;color:#fff;border-color:#1D2226}
tr.mk td{background:color-mix(in srgb,var(--mkf) 55%,#fff) !important}tr.mk td:first-child{box-shadow:inset 3px 0 0 var(--mk)}
td.cm{min-width:150px;max-width:240px}td.cm .etq{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;margin:0 0 3px}td.cm .rec{display:block;font-size:12px;color:#B3261E;font-weight:600;line-height:1.35}td.cm .sem{color:#B3B9BE}
.gpv{display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:wrap}.gpb{width:28px;height:28px;flex:none;border-radius:50%;border:1px solid var(--bd);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05);color:#7A8085;font:700 13px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.gpb.ok:hover{border-color:#4F8A72;color:#3D7A61}.gpb.nao:hover{border-color:#B4532E;color:#B4532E}.gpb.ok.on{background:#4F8A72;border-color:#4F8A72;color:#fff}.gpb.nao.on{background:#B4532E;border-color:#B4532E;color:#fff}
.gpb.cm svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.gpb.cm.on{background:#EEF3F9;border-color:#C9D8EA;color:#2F5D8A}.gpb.cm:hover{border-color:#2F5D8A;color:#2F5D8A}
.gct{display:block;margin-top:3px;font-size:12px;line-height:1.35;color:#2F5D8A;cursor:pointer}.gct b{font-weight:700}.gpv .etq{margin:0}.gcmp .bt.nao{background:#B4532E;border-color:#B4532E}.gcmp textarea.er{border-color:#B4532E;box-shadow:0 0 0 2px #F6E0D6}
.gcm{display:block;text-align:left;margin-top:4px;background:none;border:1px dashed #B8C7D9;border-radius:8px;padding:4px 9px;font:600 11.5px Inter,sans-serif;color:#2F5D8A;cursor:pointer}.gcm.on{border:1px solid #C9D8EA;background:#EEF3F9;font-weight:500;font-size:12px;color:#1D2226;line-height:1.35}.gcm.on b{display:block;font-size:10.5px;color:#2F5D8A;text-transform:uppercase;letter-spacing:.04em}
.gcmp{position:fixed;z-index:70;width:340px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.2);padding:12px;display:flex;flex-direction:column;gap:6px;font-family:Inter,sans-serif}.gcmp small{color:var(--mu);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gcmp textarea{width:100%;box-sizing:border-box;border:1px solid var(--bd);border-radius:9px;padding:8px 10px;font:13px Inter,sans-serif;resize:vertical}.gcmp div{display:flex;gap:6px;justify-content:flex-end}
.fxb{background:none;border:0;padding:2px;margin-left:3px;cursor:pointer;color:#A9AEB3;vertical-align:-2px;line-height:0}.fxb svg,.ib svg.fx{width:11px;height:11px}.fxb svg{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}.fxb.on{color:#1D2226}.fxb.on svg{fill:#1D2226}
.ib[data-fx] svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linejoin:round}.ib[data-fx].on{background:#1D2226;color:#fff;border-color:#1D2226}.ib[data-fx].on svg{fill:#fff}
.fxs{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:8px 2px 0;font-size:13px}.fxs b{color:#2F5D8A}.fxs span{font-weight:700;font-variant-numeric:tabular-nums}.fxs small{color:#7A8085}.fxs button{margin-left:auto;background:none;border:0;color:#2F5D8A;font:600 12px Inter,sans-serif;cursor:pointer}
.gfx{position:fixed;z-index:60;width:300px;max-width:calc(100vw - 24px);background:#F8F9FA;color:#1D2226;border:1px solid #DCDFE2;border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.16);padding:10px;font:13px Inter,sans-serif;box-sizing:border-box}
.gfxq{width:100%;box-sizing:border-box;border:1px solid #DCDFE2;border-radius:9px;padding:8px 10px;font:500 13px Inter,sans-serif;outline:none;background:#fff;color:#1D2226}.gfxq:focus{border-color:#1D2226}
.gfxa{display:flex;gap:12px;margin:8px 2px 6px}.gfxa button,.gfxt button{background:none;border:0;color:#2F5D8A;cursor:pointer;padding:0;font:600 12px Inter,sans-serif}
.gfxl{max-height:300px;overflow:auto;border-top:1px solid #DCDFE2;border-bottom:1px solid #DCDFE2;padding:4px 0}.gfxl label{display:flex;align-items:center;gap:9px;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:12.5px}.gfxl label:hover{background:#fff}
.gfxl input{accent-color:#1D2226;width:15px;height:15px;margin:0}.gfxl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gfxl i{font-style:normal;color:#7A8085;font-size:11.5px;font-variant-numeric:tabular-nums}
.gfxt{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#7A8085;padding:8px 4px 3px}.gfxt span{text-transform:none;letter-spacing:0;font-weight:500}
.gfxf{display:flex;justify-content:space-between;align-items:center;padding-top:8px}.gfz{background:none;border:0;color:#7A8085;cursor:pointer;font:500 12px Inter,sans-serif;padding:0}.gfok{background:#1D2226;color:#fff;border:0;border-radius:999px;padding:7px 16px;font:600 12.5px Inter,sans-serif;cursor:pointer}

const ORG_OPC = [["tela", "Como está na tela"], ["n", "Nº da lista"], ["mun", "Município"], ["reg", "Região"], ["lid", "Líder"], ["v", "Valor (maior primeiro)"], ["area", "Área"]];

function opcImprimir() { const P = pend();

function documento() { const win = window.open("", "_blank"); if (!win) return alert("Libere as janelas pop-up do navegador para imprimir.");
  const comMud = IMP.mud && pend().length, base = comMud ? ST.filter((x) => x._st !== "x" || true) : ORIG.map((x) => ({ ...x, _st: "" }));

  const ag = new Date(), dt = ag.toLocaleDateString("pt-BR"), hr = ag.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  const pc = (a, b) => b ? Math.round(a / b * 100) + "%" : "—", nome = (o, v) => (o.find((q) => q[0] === v) || [, ""])[1];

  const kk = (x) => ordem[0] === "n" ? nOrig(x) : ordem[0] === "v" ? val(x) : ordem[0] === "reg" ? norm(regDe(x)) + norm(x.mun) : norm(x[ordem[0]] || "~");

  const antigo = (x, c) => { if (!comMud || x._st !== "m") return ""; const o = ORIG.find((y) => y.id === x.id); return o && String(o[c] ?? "") !== String(x[c] ?? "") ? (c === "v" ? `<s>R$ ${moeda(o.v)}</s>` : `<s>${esc(o[c] || "—")}</s>`) : ""; };

// cronômetro do prazo (o mesmo da página do líder, indicar-lider.html): dias, horas e minutos até fechar
function cronometro() { if (!LK || !LK.prazo) return ""; const F = new Date(LK.prazo), s = Math.max(0, (F - new Date()) / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  const tx = `Prazo · ${F.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })}, ${F.getHours()}h${F.getMinutes() ? String(F.getMinutes()).padStart(2, "0") : ""}`;
  return ABERTO && s ? `<span class="tk">${tx}</span><div class="icd"><div><b>${d}</b><span>dias</span></div><div><b>${String(h).padStart(2, "0")}</b><span>horas</span></div><div><b>${String(m).padStart(2, "0")}</b><span>min</span></div></div>` : `<span class="tk">${tx}</span><b class="gfim">Link encerrado</b>`; }
setInterval(() => { const c = document.getElementById("gcr"); if (c) c.innerHTML = cronometro(); if (ABERTO && LK && new Date(LK.prazo) <= new Date()) { ABERTO = false; redesenha(); } }, 30000);
// ---------- dados ----------
const doBanco = (x) => ({ id: x.id, mun: x.municipio || null, obj: x.objeto || null, area: x.area || null, nat: x.natureza === "Investimento" ? "Capital" : x.natureza || null, v: +x.valor || 0, lid: x.lideranca || null, con: x.contato || null, jus: x.justificativa || null, ben: x.benef_tipo || null, rs: x.razao_social || null, cnpj: x.cnpj || null, etq: x.etq || null, nota: x.nota_lider || null, ng: x.nota_gestor || null, ngEm: x.nota_gestor_em || null, pa: x.parecer_gestor || null });
const COL = { mun: "municipio", obj: "objeto", area: "area", nat: "natureza", v: "valor", lid: "lideranca", con: "contato", jus: "justificativa", ben: "benef_tipo", rs: "razao_social", cnpj: "cnpj", ori: "orientacao" };
// mudanças locais → [{acao, item_id, dados, limpar}] para gestor_enviar
function payload(P) { return P.map((x) => { if (x._st === "x") return { acao: "excluir", item_id: x.id };
  const d = {}, limpar = []; CAMPOS.forEach((c) => { const v = x[c]; if (x._st === "m" && !mudou(x, c)) return; if (v == null || v === "") { if (x._st === "m" && c !== "ori") limpar.push(COL[c]); } else d[COL[c]] = c === "v" ? +v : v; });
  return x._st === "n" ? { acao: "incluir", dados: d } : { acao: "alterar", item_id: x.id, dados: d, limpar }; }); }
const pendDe = (x) => PEND.find((p) => p.item_id && p.item_id === x.id);
const pendTxt = (p) => p.acao === "excluir" ? "Pedido de exclusão enviado, aguardando o gabinete" : "Alteração enviada, aguardando o gabinete: " + Object.entries(p.dados || {}).map(([k, v]) => `${k} = ${v == null ? "(vazio)" : k === "valor" ? moeda(v) : v}`).join(" · ");
function pendHtml() { if (!PEND.length) return "";
  const nome = (p) => { const x = ORIG.find((y) => y.id === p.item_id), d = p.dados || {}; return p.acao === "incluir" ? `Nova · ${esc(d.municipio || "sem município")} · ${esc(d.objeto || "")} · ${rc(d.valor || 0)}` : `${p.acao === "excluir" ? "Excluir" : "Alterar"} · ${esc(x ? x.mun || "—" : "emenda")} · ${esc(x ? x.obj || "" : "")}`; };
  return `<div class="pend"><b>Enviadas, aguardando o gabinete</b><span>${PEND.length} ${PEND.length === 1 ? "mudança" : "mudanças"} · o gabinete aceita ou recusa cada uma</span>${PEND.map((p) => `<div class="pl"><span class="tag ${p.acao === "incluir" ? "nw" : p.acao === "excluir" ? "x" : "m"}">${p.acao === "incluir" ? "nova" : p.acao === "excluir" ? "excluir" : "alterada"}</span><span class="pt">${nome(p)}</span>${ABERTO ? `<button class="ab lx" data-desiste="${p.id}" title="Desistir desta mudança">${ici("x")}</button>` : ""}</div>`).join("")}</div>`; }
async function desistir(id) { if (!confirm("Desistir desta mudança enviada?")) return; try { await rpc("gestor_desistir", { p_token: TOKEN, p_id: id }); await carregar(); } catch (e) { alert("Não foi possível: " + (e.message || e)); } }
async function carregar(junta) { const [l, pj] = await Promise.all([rpc("gestor_abrir", { p_token: TOKEN }), PORT.length ? null : fetch("../dados/painel/portfolio-objetos.json?v=2").then((r) => r.json()).catch(() => null)]); if (pj) PORT = pj.O || []; if (!l) throw new Error("link inválido");
  LK = l; ABERTO = !!l.aberto; PEND = l.pendentes || []; const c = l.cota || {}; COTA = +c.disp || 0; MAXE = +c.max || 0; SAUDE = c.saude != null ? +c.saude : .5;
  NOMEL = "Emendas " + (l.lista || ""); GAB = String(l.titulo || "").split(" · ")[0]; document.title = NOMEL + " · Link Gestor";
  // ao voltar para a aba (junta), a lista vem de novo do gabinete: o que o gestor está mexendo e ainda não enviou fica como está (23/11/2026)
  const NOVO = (l.itens || []).map(doBanco);
  if (junta) { const loc = new Map(ST.filter((x) => x._st && x._st !== "n").map((x) => [x.id, x])), novas = ST.filter((x) => x._st === "n");
    ORIG = NOVO; ST = [...novas, ...NOVO.map((o) => loc.get(o.id) || { ...o, _st: "" })]; }
  else { ORIG = NOVO; ST = ORIG.map((x) => ({ ...x, _st: "" })); }
  document.getElementById("muns").innerHTML = Object.keys(REG).sort().map((m) => `<option value="${esc(m)}">`).join("");
  document.getElementById("lids").innerHTML = [...new Set(ORIG.map((x) => x.lid).filter(Boolean))].sort().map((m) => `<option value="${esc(m)}">`).join("");
  redesenha(); }
(async () => { const A = document.getElementById("app");
  if (!TOKEN) { A.innerHTML = '<div class="erro"><b>Link incompleto</b>Peça ao gabinete o link completo.</div>'; return; }
  A.innerHTML = '<p class="nota">Abrindo a lista…</p>';
  // sem polling (regra de capacidade): atualiza só quando a pessoa volta para a aba, no máximo uma vez a cada 20 s, e nunca no meio de uma edição
  let ult = Date.now(); const reler = async () => { if (document.hidden || !LK || Date.now() - ult < 20000) return;
    const a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return; if (document.querySelector(".cfp, .ipop, #cd")) return;
    ult = Date.now(); try { await carregar(true); } catch (e) {} };
  document.addEventListener("visibilitychange", reler); addEventListener("focus", reler);
  try { await carregar(); } catch (e) { A.innerHTML = `<div class="erro"><b>Não foi possível abrir</b>${/inválido/.test(e.message) ? "Este link não existe ou foi apagado pelo gabinete." : esc(e.message || e)}</div>`; } })();
