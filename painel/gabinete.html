<style>
@font-face{ font-family:"Inter"; src:url(../fontes/InterVariable.woff2) format("woff2"); font-weight:100 900; font-display:swap; }

*{ box-sizing:border-box; } html,body{ margin:0; background:var(--fundo); color:var(--texto); font:14px/1.45 "Inter",system-ui,sans-serif; overflow-x:hidden; }
