<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indicação de emendas</title>
<meta name="robots" content="noindex,nofollow">
<style>
@font-face{font-family:"Inter";src:url(../fontes/InterVariable.woff2) format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
button,input,textarea,select{font-family:inherit}
:root{--sf:#EEF0F2;--tl:#F8F9FA;--bd:#DEE2E5;--tx:#1D2226;--mu:#6E767D;--or:#E8822A}
body{margin:0;background:var(--sf);color:var(--tx);font-family:Inter,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:18px 16px 110px}
.mut{color:var(--mu)}
.org{font-size:12.5px;color:var(--mu)}
/* cabeçalho, como o da Indicação de recursos */
.ihd{display:flex;align-items:center;gap:10px;margin:10px 0 14px;flex-wrap:wrap}.ihd h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}.ihd span{color:var(--mu);font-size:12.5px}
.ii{width:22px;height:22px;border-radius:50%;border:1px solid var(--bd);background:var(--tl);color:var(--mu);font-weight:600;font-size:12px;line-height:1;font-style:italic;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;position:relative}
.ii:hover,.ii.on{border-color:var(--tx);color:var(--tx)}
.ipop{position:absolute;z-index:30;max-width:340px;background:var(--tl);border:1px solid var(--bd);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.14);padding:12px 14px;font-size:12.5px;line-height:1.5;color:var(--tx)}
.ipop b{font-weight:600}
/* capa: três quadros iguais aos da planilha */
.icapa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:16px}
.icapa .t{background:var(--tl);padding:12px 15px;display:flex;flex-direction:column;gap:5px}
.tk{font-size:11.5px;color:var(--mu)}
.iv{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}.iv small{display:block;font-size:11.5px;font-weight:400;color:var(--mu);margin-top:2px}
.ibar{height:7px;border-radius:9px;background:#DDE1E4;overflow:hidden}.ibar i{display:block;height:100%;background:#1D2226}
.icd{display:flex;gap:6px}.icd div{background:#fff;border:1px solid var(--bd);border-radius:9px;width:52px;padding:5px 0;text-align:center}.icd b{display:block;font-size:18px;color:var(--or);font-variant-numeric:tabular-nums}.icd span{font-size:10px;color:var(--mu)}
/* cartão por emenda */
.it{background:var(--tl);border:1px solid var(--bd);border-radius:14px;padding:12px 14px 14px;margin-bottom:10px}
.ih{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.nn{font-size:12.5px;color:var(--mu);min-width:16px;font-variant-numeric:tabular-nums}
.it.feito .nn{color:#1FA845;font-weight:600}
.ih .m{font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.ch{font-weight:500;font-size:12px;border-radius:999px;padding:4px 11px;background:#DDE1E4;color:#3A4146;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.ch svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.ch.v{background:#1D2226;color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.fl{display:block;font-size:11px;color:var(--mu);font-weight:500;padding:4px 0 0 8px}
.ed{display:block;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 8px;font-weight:500;font-size:13px;color:var(--tx);outline:none}
.ed:hover{border-color:var(--bd)}.ed:focus{border-color:#1D2226;background:#fff}
.seg{display:inline-flex;gap:6px;padding:4px 0 0 8px}.seg button{font-weight:500;font-size:12.5px;padding:5px 13px;border-radius:999px;background:#fff;border:1px solid var(--bd);color:var(--tx);cursor:pointer}.seg button.on{background:#1D2226;color:#fff;border-color:#1D2226}
.obj{display:flex;align-items:center;gap:10px;margin-top:6px;padding:9px 8px 0;border-top:1px solid var(--bd)}
.obj .o{flex:1;min-width:0;font-size:13px;font-weight:500;line-height:1.4}
.obj .o.vz{color:var(--mu);font-weight:400}
.obj .o small{display:block;font-size:11px;color:var(--mu);font-weight:400;margin-top:2px}
.tg{font-weight:500;font-size:11px;border-radius:999px;padding:2px 8px;background:#FBE7D5;color:#9A4E10;white-space:nowrap;vertical-align:1px;margin-left:4px}
.tg.p{background:#E3EAF5;color:#2F5D8A}
.tg.ok{background:#D5F0DC;color:#17692F;font-weight:600}
.bt{font-weight:500;font-size:12.5px;padding:6px 14px;border-radius:999px;background:#1D2226;color:#fff;border:1px solid #1D2226;cursor:pointer;white-space:nowrap}
.bt.s{background:#fff;color:var(--tx);border-color:var(--bd)}
.lk0{background:none;border:0;color:var(--mu);font-weight:500;font-size:12px;cursor:pointer;padding:6px 8px;text-decoration:underline;text-underline-offset:2px}
/* escolha no portfólio, mesmo popup da planilha */
.pp{position:fixed;inset:0;background:rgba(10,12,14,.35);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.pb{background:var(--tl);width:100%;max-width:620px;max-height:86vh;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
@media(min-width:700px){.pp{align-items:center}.pb{border-radius:16px}}
.pb .hh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.pb h3{margin:0;font-size:15px;font-weight:600}
.pb input{border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font-weight:500;font-size:13px;outline:none;background:#fff}
.pl{overflow:auto;display:flex;flex-direction:column;padding-bottom:6px}
.ipga{font-size:11px;color:var(--mu);font-weight:500;padding:10px 10px 4px}
.po{text-align:left;border:0;border-bottom:1px solid var(--bd);background:none;padding:9px 10px;cursor:pointer;font-weight:500;font-size:13px;color:var(--tx)}
.po:hover{background:#fff}.po em{display:block;font-style:normal;color:var(--mu);font-size:11.5px;margin-top:2px;font-weight:400}
.po.out{color:var(--mu);border-bottom:0}
/* barra de envio */
.env{position:fixed;left:0;right:0;bottom:0;background:var(--tl);border-top:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:center}
.env > div{max-width:860px;width:100%;display:flex;align-items:center;gap:14px}
.env .pr{flex:1;font-size:12.5px;color:var(--mu)}.env .pr b{color:var(--tx);font-weight:600;font-size:14px}
.etq{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.rec{background:#EEF3F9;border:1px solid #C9D8EA;border-radius:10px;padding:8px 11px;margin:0 0 8px;font-size:12.5px;color:#B3261E;font-weight:600;line-height:1.45}.rec b{display:block;font-size:11px;color:#2F5D8A;margin-bottom:2px}
.bt.tr{background:#DDF3E1;color:#17883A;border-color:#BFE3C9;display:inline-flex;align-items:center;gap:7px}.bt.tr:hover{background:#CDEFD5}
.env .ibar{margin-top:6px}.env .ibar i{background:#1FA845}
/* confirmação ✓ ✕ */
.cfp{position:fixed;inset:0;z-index:40;background:rgba(10,12,14,.35);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.cfb{background:var(--tl);border-radius:16px;padding:22px 24px 18px;max-width:380px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.cfb b{font-size:17px;font-weight:600}.cfb p{color:var(--mu);font-size:13px;margin:6px 0 18px}
.cfb > div{display:flex;justify-content:flex-end;gap:10px}
.vxb{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:#fff;color:var(--mu);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.vxb.v{background:#1D2226;border-color:#1D2226;color:#fff}
.fim{text-align:center;padding:60px 16px}.fim b{font-size:20px;font-weight:600}
@media(max-width:600px){.icapa{grid-template-columns:1fr 1fr}.icapa .w2{grid-column:span 2}.g2{grid-template-columns:1fr}.chips{margin-left:0;width:100%}}

/* cartão: cabeçalho, linha de campos, objeto e justificativa */
.ih .m{font-size:16.8px;font-weight:600;letter-spacing:-.01em}
.ch.v{background:#1FA845;color:#fff}
.lin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;margin-bottom:8px}
.cx{display:flex;flex-direction:column;gap:3px}
.cx .fl{padding:0 0 0 8px}
.ed{border-color:var(--bd);background:#fff}
.sw{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;height:34px;padding:3px;border-radius:999px;background:#E4E7E9;border:0;cursor:pointer;user-select:none;font-size:12.5px;font-weight:500;color:var(--mu)}
.sw > span:not(.tr){position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:0 14px;transition:color .2s}
.sw .on{color:#fff}
.sw .tr{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:#1D2226;transition:transform .2s}
.sw.ent .tr{transform:translateX(100%)}
.sw:focus-visible{outline:2px solid #1D2226;outline-offset:2px}
.sel{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:500;color:var(--tx);cursor:pointer}
.sel:hover{border-color:#1D2226}
.sel .o{flex:1;min-width:0;line-height:1.4}.sel .o.vz{color:var(--mu);font-weight:400}
.sel .ca{color:var(--mu);font-size:11px;flex:none}
textarea.ed{resize:vertical;min-height:58px;line-height:1.45;font-weight:400}
.it.feito .sel{border-color:#BFE3C9}
.msg{text-align:center;padding:70px 16px;color:var(--mu)}.msg b{display:block;color:var(--tx);font-size:18px;font-weight:600;margin-bottom:6px}
.sv{font-size:11.5px;color:var(--mu);white-space:nowrap}.sv.er{color:#C0392B}
.dec{font-size:11.5px;color:var(--mu);margin:0 0 6px 8px}.dec b{color:#1F7A34;font-weight:600}
.it.trv .sel,.it.trv .ed,.it.trv .sw{pointer-events:none;opacity:.75}
/* 20/11/2026: quem recebe o link preenche só o OBJETO e a JUSTIFICATIVA (borda forte); o resto vem do gabinete, travado e meio opaco */
.ed.trav, .sw.trav{ opacity:.55; pointer-events:none; background:var(--sf) !important; border-color:var(--bd) !important; }
.sel.pree, textarea.ed.pree{ border:1.5px solid #1D2226 !important; background:#fff; box-shadow:0 0 0 3px rgba(29,34,38,.06); }
.sel.pree:hover, textarea.ed.pree:focus{ box-shadow:0 0 0 3px rgba(29,34,38,.12); }
.it.feito .sel.pree{ border-color:#1FA845 !important; }
/* borda verde metálica com um brilho que corre devagar, no objeto ainda não escolhido (no escolhido fica verde parada;
   quem prefere menos movimento vê só a borda verde) */
@keyframes brilho{ from{ background-position:0 0, 200% 0; } to{ background-position:0 0, 0% 0; } }
.it:not(.feito):not(.trv) .sel.pree{ border:2px solid transparent !important; box-shadow:0 0 0 3px rgba(31,168,69,.10);
  background:linear-gradient(#fff, #fff) padding-box, linear-gradient(100deg, #1FA845 0%, #1FA845 38%, #8FDCA6 46%, #BDEBCB 50%, #8FDCA6 54%, #1FA845 62%, #1FA845 100%) border-box;
  background-size:100% 100%, 200% 100%; background-repeat:no-repeat, repeat-x; animation:brilho 4s linear infinite; }
@media (prefers-reduced-motion:reduce){ .it .sel.pree{ animation:none !important; } }
.trv .sel.pree, .trv textarea.ed.pree{ border-color:var(--bd) !important; box-shadow:none; }
/* objeto fora do Portfólio (20/11/2026): texto cinza claro, etiqueta vermelha e aviso; Enviar fica apagado até resolver */
.sel .o.inc{ color:#A4ABB1; font-weight:400; text-decoration:line-through; text-decoration-color:rgba(164,171,177,.6); }
.tg.x{ background:#FBE3DF; color:#B23A2A; text-decoration:none; display:inline-block; }
.avi{ margin:6px 4px 0; font-size:12px; font-weight:500; color:#B23A2A; display:flex; gap:6px; align-items:center; } .avi:before{ content:"!"; width:16px; height:16px; border-radius:50%; background:#B23A2A; color:#fff; font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:none; }
.bt.off{ opacity:.45; }
@keyframes chama{ 0%,100%{ box-shadow:none; } 30%{ box-shadow:0 0 0 4px rgba(178,58,42,.25); } }
.it.chama{ animation:chama 1.2s ease-in-out 2; }
</style></head><body><main id="app"></main>
<datalist id="muns"></datalist>
<script>
// Indicação de emendas por link (20/11/2026): página PÚBLICA, sem login. O gabinete manda indicar-lider.html?t=TOKEN
// a um líder (ou a uma pessoa só). Tudo passa pelas funções link_abrir / link_salvar / link_enviar (migração 103),
// que conferem o token, o prazo e se a emenda é do link. Portfólio e municípios vêm do próprio site (GitHub Pages).
const SB = "https://uxqxhvzeptuedyggwguh.supabase.co", KEY = "sb_publishable_51xruPXb33u2lkXFuw1jjQ_fK4N-wph";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const rpc = async (f, a) => { const r = await fetch(`${SB}/rest/v1/rpc/${f}`, { method: "POST", headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" }, body: JSON.stringify(a) });
  const j = await r.json().catch(() => null); if (!r.ok) throw new Error((j && j.message) || "erro " + r.status); return j; };
const rc = (v) => v >= 1e6 ? "R$ " + (v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + "M" : "R$ " + Math.round(v / 1e3) + " mil";
const ni = (v) => Math.round(+v || 0).toLocaleString("pt-BR");
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const CAD = '<svg viewBox="0 0 12 12"><rect x="2.5" y="5.5" width="7" height="5" rx="1"/><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5"/></svg>';
// área da emenda (como está no gabinete) → áreas do Portfólio; FUNDAM ou sem área = tudo que não é Saúde
const AREA_P = { "Saúde": ["Saúde"], "Educação": ["Educação", "Educação Especial"], "Agricultura": ["Agricultura e Pesca"], "Infraestrutura e Mobilidade": ["Infraestrutura", "Portos, Aeroportos e Ferrovias"], "Segurança Pública": ["Segurança Pública", "Defesa Civil"] };
let L = null, IT = [], ST = [], PORT = [], MUN = [], FECHA = null, ABERTO = false;
// só vale objeto do Portfólio compatível com a área e a despesa da emenda (20/11/2026); outro texto (inclusive o que veio da
// planilha do gabinete) aparece em cinza claro com o aviso, não conta como preenchido e impede o envio
const portOk = (i, obj) => !!obj && compat(IT[i]).some((o) => norm(o[2]) === norm(obj));
const feito = (s, i) => portOk(i, s.obj);
const incomp = (s, i) => !!s.obj && !portOk(i, s.obj);
const grupo = (x) => x.area === "Saúde" ? "Saúde" : "FUNDAM";
function compat(x) { const A = AREA_P[x.area]; return PORT.filter(([area, , , nat]) => (A ? A.includes(area) : x.area === "Saúde" ? area === "Saúde" : area !== "Saúde") && (!x.natureza || nat === x.natureza || / ou /.test(nat))); }
const INFO = () => `As emendas já vêm com o que o gabinete preparou. Você preenche só os campos com borda escura: o <b>objeto</b> (do Portfólio) e a <b>justificativa</b>.<br><br>Município, quem recebe, área, tipo de despesa e valor foram definidos pelo gabinete e não mudam aqui. Tudo o que você preenche fica salvo sozinho; ao terminar, toque em <b>Enviar ao gabinete</b>. ${ABERTO ? `Até ${FECHA.toLocaleDateString("pt-BR")}, ${FECHA.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}, você pode voltar a este link e mudar.` : ""}`;
function cont() { const s = Math.max(0, (FECHA - new Date()) / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return ABERTO && s ? `<div class="icd"><div><b>${d}</b><span>dias</span></div><div><b>${String(h).padStart(2, "0")}</b><span>horas</span></div><div><b>${String(m).padStart(2, "0")}</b><span>min</span></div></div>` : `<b style="color:#C0392B;font-weight:600">Link encerrado</b>`; }
const prazoTx = () => `Prazo · ${FECHA.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })}, ${FECHA.getHours()}h${FECHA.getMinutes() ? String(FECHA.getMinutes()).padStart(2, "0") : ""}`;
const msg = (t, s) => { document.getElementById("app").innerHTML = `<div class="msg"><b>${t}</b>${s || ""}</div>`; };
async function iniciar() {
  if (!TOKEN) return msg("Link incompleto", "Peça ao gabinete para enviar o link de novo.");
  msg("Carregando…");
  try { const [l, p, b] = await Promise.all([rpc("link_abrir", { p_token: TOKEN }), fetch("../dados/painel/portfolio-objetos.json?v=2").then((r) => r.json()), fetch("../dados/painel/sc-base.json").then((r) => r.json())]);
    if (!l) return msg("Link inválido", "Este link não existe mais. Peça ao gabinete um link novo.");
    L = l; IT = l.itens || []; PORT = p.O; MUN = b.mun.map((m) => m.n); FECHA = new Date(l.prazo); ABERTO = !!l.aberto;
    const P = {}; (l.propostas || []).forEach((x) => { P[x.item_id] = x; });
    // proposta já decidida (aceita ou recusada) não manda mais na tela (23/11/2026): a planilha do gabinete é a verdade e o link
    // mostra o que está nela agora; a proposta só vale enquanto o líder ainda está mexendo (rascunho) ou esperando (enviado)
    ST = IT.map((x) => { const q0 = P[x.id], dec = q0 && (q0.status === "aceito" || q0.status === "recusado"), q = dec ? null : q0; return q ? { mun: q.municipio || x.municipio || "", bt: q.benef_tipo || (x.benef_tipo === "ent" ? "ent" : "mun"), ben: q.beneficiario || "", cnpj: q.cnpj || "", obj: q.objeto || null, fonte: q.objeto_fonte || "", com: q.justificativa || "", status: q.status }
      : { mun: x.municipio || "", bt: x.benef_tipo === "ent" ? "ent" : "mun", ben: x.benef_tipo === "ent" ? x.beneficiario || "" : "", cnpj: x.benef_tipo === "ent" ? x.cnpj || "" : "", obj: !l.limpo && x.objeto || null, fonte: !l.limpo && x.objeto ? "gab" : "", com: l.limpo ? "" : x.justificativa || "", status: dec ? q0.status : "" }; });   // link "limpo": sem objeto e sem justificativa   // sem proposta: já vem com o que o gabinete revisou (20/11/2026)
    document.getElementById("muns").innerHTML = MUN.map((m) => `<option value="${esc(m)}">`).join("");
    render(); if (!window.__tk) window.__tk = setInterval(() => { const c = document.querySelector(".icapa .w2"); if (c) c.innerHTML = `<span class="tk">${prazoTx()}</span>${cont()}`; }, 30000);
  } catch (e) { msg("Não foi possível abrir", "Confira a internet e recarregue a página. (" + esc(e.message) + ")"); } }
// trancado depois de enviar (migração 113): só o gabinete reabre
// etiqueta e recado do gabinete (migração 114): mesmas cores das etiquetas da planilha (ETQ_PAL em gabinete-ind-links.js)
const ETQ_PAL = { cinza: ["#E3E6E8", "#3E454B"], vermelho: ["#FBD9D5", "#9B2C20"], laranja: ["#FCE3CC", "#9A4E10"], amarelo: ["#FBF0C2", "#7A5D00"], verde: ["#D5F0DC", "#17692F"], turquesa: ["#CDEFEA", "#0F6359"], azul: ["#D6E4F7", "#1F4E85"], roxo: ["#E6DDF7", "#5A3A99"], rosa: ["#F8D9EA", "#94285F"], marrom: ["#EADFD6", "#6A4A33"] };
const ETQ_INI = { "Resolvido · falta enviar": "verde", "Em andamento": "amarelo", "Atenção": "laranja", "Crítico": "vermelho", "Aguardando retorno": "azul" };
const etqChip = (e) => { if (!e || !e.n) return ""; const [bg, fg] = ETQ_PAL[e.c || ETQ_INI[e.n] || "cinza"] || ETQ_PAL.cinza; return `<span class="etq" style="background:${bg};color:${fg}">${esc(e.n)}</span>`; };
const trava = (s) => !ABERTO || !!L.travado || s.status === "aceito" || s.status === "recusado";
const CADF = '<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>';
