<!-- Corrida da Mesa (versão funcional 08/10/2026). Acesso: logado + liberado pelo

     salvo em mesa_cenarios (um por usuário) com cópia no navegador. Regras:
     cada cargo/estrutura vale uma vez por chapa; comissões pelo art. 30 do RI

<style>
