<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de tela</title>
<style>
  body{ margin:0; background:#0C0E10; color:#F2F4F5; font-family:-apple-system,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; }
  .n{ font-size:64px; font-weight:800; color:#34E84A; }
  .l{ font-size:16px; color:#8A9096; margin-top:6px; }
  .box{ padding:20px; }
</style></head>
<body>
  <div class="box">
    <div class="l">Largura da janela (o número que importa)</div>
    <div class="n" id="w">…</div>
    <div class="l" style="margin-top:30px;">Outros números:</div>
    <div class="l" id="extra">…</div>
  </div>
<script>
  document.getElementById('w').textContent = window.innerWidth + ' px';
  document.getElementById('extra').innerHTML =
    'Altura da janela: ' + window.innerHeight + ' px<br>' +
    'Resolução da tela: ' + screen.width + ' x ' + screen.height + '<br>' +
    'Zoom/escala (devicePixelRatio): ' + window.devicePixelRatio;
</script>
</body></html>
