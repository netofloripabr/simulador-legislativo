<script>
// Fora do claude.ai, window.storage não existe — este substituto usa o
// armazenamento do próprio navegador (localStorage) para que "Salvar cenário"
// e "Restaurar" continuem funcionando quando o arquivo é aberto localmente.
if(typeof window.storage === 'undefined'){
  window.storage = {
    async get(key){ const v = localStorage.getItem(key); return v!==null ? {key, value:v, shared:false} : null; },
    async set(key, value){ localStorage.setItem(key, value); return {key, value, shared:false}; },
    async delete(key){ localStorage.removeItem(key); return {key, deleted:true, shared:false}; },
    async list(prefix){ const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)); return {keys, prefix, shared:false}; }
  };
}
</script>
